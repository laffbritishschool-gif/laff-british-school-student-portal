<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png"><title>Academic Result | Laff British Montessori School</title>
<style>:root{--blue:#0755a5;--deep:#063b78;--yellow:#f4c20d;--ink:#182b40;--muted:#66788b;--line:#d7e1eb}*{box-sizing:border-box}body{margin:0;background:#eef2f6;color:var(--ink);font-family:Arial,Helvetica,sans-serif}.actions{max-width:900px;margin:18px auto;display:flex;justify-content:flex-end;gap:10px}.btn{border:0;border-radius:5px;padding:11px 18px;background:var(--blue);color:#fff;font-weight:800;cursor:pointer}.btn.back{background:#fff;color:var(--blue);border:1px solid #ccd8e4}.sheet{width:min(900px,calc(100% - 30px));margin:0 auto 40px;background:#fff;box-shadow:0 12px 35px rgba(20,45,70,.12);padding:42px}.school{text-align:center;border-bottom:3px solid var(--deep);padding-bottom:17px;position:relative}.school img{width:78px;height:78px;object-fit:contain;position:absolute;left:0;top:0}.school h1{margin:0;padding:0 85px;font-size:25px;color:var(--deep);text-transform:uppercase}.school h2{margin:7px 0 4px;font-size:16px;letter-spacing:1px}.school p{white-space:pre-line;margin:4px 0;color:var(--muted);font-size:11px;line-height:1.5}.title{margin:22px 0 15px;text-align:center}.title h3{margin:0;color:var(--deep);font-size:18px}.title span{display:inline-block;margin-top:6px;background:#edf5fc;color:var(--blue);padding:5px 10px;border-radius:20px;font-size:11px;font-weight:800}.student{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);margin-bottom:20px}.item{padding:11px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line)}.item:nth-child(4n){border-right:0}.item small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;margin-bottom:5px}.item b{font-size:11px}.table{width:100%;border-collapse:collapse;font-size:10.5px}.table th,.table td{border:1px solid #cfd9e3;padding:9px 7px}.table th{background:#edf3f8;color:var(--deep);font-size:9.5px;text-transform:uppercase}.center{text-align:center}.grade{font-weight:900}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:18px 0}.card{border:1px solid var(--line);padding:12px;text-align:center;background:#fafcfe}.card small{display:block;color:var(--muted);font-size:9px;margin-bottom:5px}.card b{font-size:16px;color:var(--deep)}.remarks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.remark{border:1px solid var(--line);padding:13px;min-height:78px}.remark h4{margin:0 0 8px;color:var(--deep);font-size:11px}.remark p{margin:0;font-size:11px;line-height:1.55}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:70px;margin-top:45px}.sig{border-top:1px solid #9ba9b7;padding-top:7px;font-size:10px;text-align:center}.note{margin-top:25px;padding:10px;background:#fff9e5;border:1px solid #efdc86;font-size:9.5px;color:#665500;text-align:center}.state{text-align:center;padding:80px 20px;color:var(--muted)}.state strong{display:block;color:var(--deep);font-size:18px;margin-bottom:8px}@media(max-width:650px){.sheet{padding:22px;width:calc(100% - 16px)}.school img{position:static;width:64px;height:64px}.school h1{padding:0;font-size:19px}.student{grid-template-columns:1fr 1fr}.item:nth-child(4n){border-right:1px solid var(--line)}.item:nth-child(2n){border-right:0}.summary{grid-template-columns:1fr 1fr}.remarks,.signatures{grid-template-columns:1fr;gap:15px}.actions{padding:0 8px}.table{min-width:700px}.table-wrap{overflow-x:auto}}@media print{body{background:#fff}.actions{display:none}.sheet{width:100%;margin:0;padding:25px;box-shadow:none}.note{break-inside:avoid}.remarks,.signatures{break-inside:avoid}.table-wrap{overflow:visible}}
</style></head><body>
<div class="actions"><button class="btn back" onclick="location.href='result-checker.html'">← Back to Result Checker</button><button class="btn" onclick="window.print()">Print Result</button></div>
<main class="sheet" id="sheet"><div class="state" id="state"><strong>Loading result</strong><span>Please wait while your result is prepared.</span></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
'use strict';const sb=supabase.createClient('https://moqpmrhholbbhuedvbgg.supabase.co','sb_publishable_IfSp9O5zUubH6rifFbfmZQ_DJttLC1f');const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
async function load(){try{const p=new URLSearchParams(location.search);const serial=p.get('serial'),pin=p.get('pin'),session=p.get('session'),term=p.get('term');if(!serial||!pin||!session||!term)throw Error('Result access details are missing.');const {data,error}=await sb.rpc('check_public_result',{p_serial:serial,p_pin:pin,p_session:session,p_term:term});if(error)throw error;if(!data?.ok)throw Error(data?.message||'Result could not be found.');const [{data:school}]=await Promise.all([sb.from('school_settings').select('school_name,motto,logo_url,address,phone,email,website').limit(1).maybeSingle()]);const rows=data.results||[];if(!rows.length)throw Error('No published subjects were found for this term.');const avg=rows.reduce((a,r)=>a+Number(r.total||0),0)/rows.length;const grade=v=>v>=70?'A':v>=60?'B':v>=50?'C':v>=45?'D':v>=40?'E':'F';const terms=String(data.term||term).replaceAll('_',' ');const schoolName=school?.school_name||'Laff British Montessori School';const logo=school?.logo_url||'https://i.ibb.co/whtP8S5v/image.png';const contact=[school?.address,school?.phone,school?.email,school?.website].filter(Boolean).join(' · ');const teacher=[...new Set(rows.map(r=>r.teacher_remark).filter(Boolean))].join(' ');const principal=[...new Set(rows.map(r=>r.principal_remark).filter(Boolean))].join(' ');const positions=rows.map(r=>Number(r.position||0)).filter(Boolean);const pos=positions.length?Math.min(...positions):null;document.title=`${data.student?.name||'Student'} - Academic Result`;document.getElementById('sheet').innerHTML=`<header class="school"><img src="${esc(logo)}" alt="School Logo"><h1>${esc(schoolName)}</h1><h2>STUDENT ACADEMIC RESULT SHEET</h2><p>${esc(school?.motto||'Excellence · Character · Confidence · Knowledge')}</p><p>${esc(contact||'Official School Academic Services')}</p></header><div class="title"><h3>OFFICIAL PUBLISHED RESULT</h3><span>${esc(data.session||session)} · ${esc(terms)}</span></div><section class="student"><div class="item"><small>Student Name</small><b>${esc(data.student?.name)}</b></div><div class="item"><small>Student ID</small><b>${esc(data.student?.student_id)}</b></div><div class="item"><small>Exam Number</small><b>${esc(data.student?.exam_number||'—')}</b></div><div class="item"><small>Result Status</small><b>Published</b></div></section><div class="table-wrap"><table class="table"><thead><tr><th>#</th><th>Subject</th><th class="center">CA</th><th class="center">Exam</th><th class="center">Total</th><th class="center">Grade</th><th class="center">Point</th><th>Teacher Remark</th></tr></thead><tbody>${rows.map((r,i)=>`<tr><td class="center">${i+1}</td><td><b>${esc(r.subject)}</b></td><td class="center">${esc(r.ca)}</td><td class="center">${esc(r.exam)}</td><td class="center"><b>${esc(r.total)}</b></td><td class="center"><span class="grade">${esc(r.grade||'—')}</span></td><td class="center">${esc(r.grade_point||'—')}</td><td>${esc(r.teacher_remark||'—')}</td></tr>`).join('')}</tbody></table></div><section class="summary"><div class="card"><small>Average Score</small><b>${avg.toFixed(2)}%</b></div><div class="card"><small>Overall Grade</small><b>${grade(avg)}</b></div><div class="card"><small>Class Position</small><b>${pos?pos:'—'}</b></div><div class="card"><small>Subjects</small><b>${rows.length}</b></div></section><section class="remarks"><div class="remark"><h4>TEACHER'S REMARK</h4><p>${esc(teacher||'No teacher remark recorded.')}</p></div><div class="remark"><h4>PRINCIPAL'S REMARK</h4><p>${esc(principal||'No principal remark recorded.')}</p></div></section><section class="signatures"><div class="sig">Class Teacher / Teacher's Signature</div><div class="sig">Principal / Head of School</div></section><div class="note">This is an official published academic result generated from the school's result system. Please keep this document for your records.</div>`}catch(e){document.getElementById('sheet').innerHTML=`<div class="state"><strong>Unable to display result</strong><span>${esc(e.message||'Please return to the result checker and try again.')}</span><br><br><button class="btn" onclick="location.href='result-checker.html'">Return to Result Checker</button></div>`}}load();
</script></body></html>
