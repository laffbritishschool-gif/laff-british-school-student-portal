<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0755a5">
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<title>My Profile | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/portal-polish.css?v=7">
<style>
.profile-hero{position:relative;overflow:hidden;display:grid;grid-template-columns:150px 1fr auto;gap:24px;align-items:center;background:linear-gradient(135deg,#063b78,#0b5ed7 68%,#0a4d91);color:#fff;border-radius:28px;padding:30px;box-shadow:0 22px 50px rgba(11,94,215,.2)}
.profile-hero:before,.profile-hero:after{content:"";position:absolute;border:1px solid rgba(255,255,255,.1);border-radius:50%;pointer-events:none}.profile-hero:before{width:300px;height:300px;right:-115px;top:-150px}.profile-hero:after{width:190px;height:190px;right:-60px;top:-95px}
.profile-avatar{position:relative;z-index:1;width:142px;height:142px;border-radius:30px;overflow:hidden;background:#eaf4ff;color:#0755a5;display:grid;place-items:center;font-size:42px;font-weight:900;border:5px solid rgba(255,255,255,.75);box-shadow:0 15px 35px rgba(0,0,0,.18)}.profile-avatar img{width:100%;height:100%;object-fit:cover}
.identity{position:relative;z-index:1}.identity .eyebrow{color:#d7e9ff;background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.15)}.identity h2{margin:9px 0 7px;font-size:31px;color:#fff}.identity p{margin:0;color:#d9e9ff}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.chip{padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);font-weight:800;font-size:12px;color:#fff}.chip.active{background:#e8f8ee;color:#14733d;border-color:#c4e8d0}
.profile-actions{position:relative;z-index:2;display:flex;flex-direction:column;gap:10px}.profile-actions .button{min-width:145px}.profile-actions .secondary{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.2)}
.section{margin-top:20px}.section-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:12px}.section-head h2{margin:0;color:var(--blue-dark);font-size:20px}.section-head p{margin:4px 0 0}.card{border-radius:22px}.detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.detail{background:#f8fbff;border:1px solid #e2ebf5;border-radius:16px;padding:16px;transition:.2s ease}.detail:hover{transform:translateY(-2px);border-color:#bdd6f2;box-shadow:0 8px 22px rgba(15,54,92,.05)}.detail small{display:block;color:#718096;margin-bottom:7px;font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.04em}.detail b{display:block;color:#1d2b3a;line-height:1.45;word-break:break-word}
.status-box{display:grid;grid-template-columns:1fr 1fr;gap:14px}.status-card{padding:18px;border-radius:18px;background:linear-gradient(135deg,#f8fbff,#fff);border:1px solid #e2ebf5}.status-card strong{display:block;font-size:24px;color:var(--blue-dark);margin-top:6px}.status-card small{color:#718096;font-weight:800}
.security{display:flex;gap:14px;align-items:flex-start;background:linear-gradient(135deg,#fff9e8,#fff);border:1px solid #f2df9a;border-radius:18px;padding:18px}.security-icon{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--yellow);color:#513f00;font-weight:900;flex:none}.security h3{margin:0;color:#513f00}.security p{margin:5px 0 0}.loading-card{text-align:center;padding:45px;color:#718096}.error-card{padding:24px;border-radius:20px;background:#fff5f4;border:1px solid #f1c7c3;color:#8d1f15}.print-only{display:none}.footer{margin-top:24px}
@media(max-width:900px){.profile-hero{grid-template-columns:100px 1fr}.profile-avatar{width:100px;height:100px;border-radius:22px;font-size:30px}.profile-actions{grid-column:1/-1;flex-direction:row}.detail-grid{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.profile-hero{grid-template-columns:1fr;text-align:center;padding:24px}.profile-avatar{margin:auto}.chips{justify-content:center}.profile-actions{justify-content:center}.profile-actions .button{flex:1;min-width:0}.detail-grid,.status-box{grid-template-columns:1fr}.identity h2{font-size:25px}.section-head{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff!important}.sidebar,.top,.profile-actions,.footer,.toast{display:none!important}.main{margin:0!important;padding:0!important}.profile-hero,.card,.status-card{box-shadow:none!important}.profile-hero{background:#fff!important;color:#123b69!important;border:1px solid #d9e1ea!important;grid-template-columns:105px 1fr;padding:18px}.profile-hero:before,.profile-hero:after{display:none}.profile-avatar{width:92px;height:92px;border:1px solid #ccc}.identity h2{color:#123b69}.identity p,.chip{color:#4b5563;background:#fff;border-color:#ddd}.identity .eyebrow{color:#123b69;background:#fff;border-color:#ddd}.profile-actions{display:none}.print-only{display:block;text-align:center;margin-bottom:18px}.print-only img{width:65px}.print-only h1{margin:5px 0;color:#123b69}.section{margin-top:14px}.detail{break-inside:avoid}.security{break-inside:avoid}}
</style>
</head>
<body>
<div id="student-app"></div>
<script type="module">
import { mountStudentShell, supabase, escapeHtml } from './assets/app.js';

mountStudentShell({
  title:'My Profile',
  subtitle:'View the personal and academic information connected to your school account.',
  content:`
    <div id="profileLoading" class="card loading-card">Loading your secure student profile…</div>
    <div id="profileContent" hidden>
      <section class="profile-hero">
        <div class="profile-avatar" id="avatar">ST</div>
        <div class="identity">
          <div class="eyebrow">Student account</div>
          <h2 id="studentName">Student</h2>
          <p id="identityLine">—</p>
          <div class="chips">
            <span class="chip active" id="statusChip">● Active</span>
            <span class="chip" id="classChip">Class —</span>
            <span class="chip" id="sessionChip">Session —</span>
            <span class="chip" id="termChip">Term —</span>
          </div>
        </div>
        <div class="profile-actions">
          <button class="button" type="button" id="printProfile">Print Profile</button>
          <button class="button secondary" type="button" data-toast="Profile changes are managed by authorized school administrators.">Request Update</button>
        </div>
      </section>

      <div class="print-only"><img src="https://i.ibb.co/whtP8S5v/image.png"><h1>Laff British Montessori School</h1><p>Official Student Profile Record</p></div>

      <section class="section">
        <div class="section-head"><div><h2>Personal information</h2><p class="muted">Your official student account details.</p></div></div>
        <div class="card"><div class="detail-grid">
          <div class="detail"><small>Full name</small><b id="fullName">—</b></div>
          <div class="detail"><small>Student ID</small><b id="studentId">—</b></div>
          <div class="detail"><small>School email</small><b id="schoolEmail">—</b></div>
          <div class="detail"><small>Examination No.</small><b id="examNumber">—</b></div>
          <div class="detail"><small>Gender</small><b id="gender">—</b></div>
          <div class="detail"><small>Phone</small><b id="phone">—</b></div>
        </div></div>
      </section>

      <section class="section">
        <div class="section-head"><div><h2>Academic placement</h2><p class="muted">Your current class and session information.</p></div></div>
        <div class="card"><div class="detail-grid">
          <div class="detail"><small>Current class</small><b id="className">—</b></div>
          <div class="detail"><small>Academic session</small><b id="sessionName">—</b></div>
          <div class="detail"><small>Current term</small><b id="termName">—</b></div>
          <div class="detail"><small>Enrollment status</small><b id="enrollmentStatus">—</b></div>
          <div class="detail"><small>Student status</small><b id="studentStatus">—</b></div>
          <div class="detail"><small>Account status</small><b>Authenticated student</b></div>
        </div></div>
      </section>

      <section class="section">
        <div class="section-head"><div><h2>Account summary</h2><p class="muted">Important account information at a glance.</p></div></div>
        <div class="status-box">
          <div class="status-card"><small>Student ID</small><strong id="summaryId">—</strong></div>
          <div class="status-card"><small>School email</small><strong id="summaryEmail">—</strong></div>
        </div>
      </section>

      <section class="section">
        <div class="card">
          <div class="security"><div class="security-icon">✓</div><div><h3>Private and protected</h3><p class="muted">This profile belongs to your authenticated student account. Keep your password private and contact the school if any official information needs correction.</p></div></div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px">
            <button class="button secondary" type="button" data-toast="Password reset requests are handled securely by the school account system.">Request Password Reset</button>
            <a class="button" href="id-card.html">View My ID Card</a>
          </div>
        </div>
      </section>
    </div>
    <div id="profileError" class="error-card" hidden></div>
    <div class="footer">© 2026 Laff British Montessori School · Secure student profile</div>
  `
});

const esc=v=>String(v??'').replace(/[&<>\\\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]||c));
const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v||'—'};
const initials=s=>`${s?.first_name?.[0]||''}${s?.last_name?.[0]||''}`.toUpperCase()||'ST';

async function loadProfile(){
  const loading=document.getElementById('profileLoading');
  try{
    const {data:{session}}=await supabase.auth.getSession();
    if(!session){location.href='student-login.html';return;}
    const uid=session.user.id;
    const [{data:student,error},{data:profile},{data:school},{data:sess},{data:term}]=await Promise.all([
      supabase.from('students').select('id,student_id,first_name,middle_name,last_name,photo_url,school_email,exam_number,status,gender,phone').eq('user_id',uid).maybeSingle(),
      supabase.from('profiles').select('full_name,is_active').eq('id',uid).maybeSingle(),
      supabase.from('school_settings').select('school_name,motto,logo_url').limit(1).maybeSingle(),
      supabase.from('academic_sessions').select('id,name').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle(),
      supabase.from('terms').select('id,name,session_id').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle()
    ]);
    if(error||!student)throw new Error('Your student profile could not be found. Please contact the school administrator.');
    const sessionRow=Array.isArray(sess)?sess[0]:sess;
    const termRow=Array.isArray(term)?term[0]:term;
    const {data:enrollment}=await supabase.from('enrollments').select('id,class_id,status,classes(name)').eq('student_id',student.id).eq('session_id',sessionRow?.id||'').order('created_at',{ascending:false}).limit(1).maybeSingle();
    const className=enrollment?.classes?.name||'Class not assigned';
    const name=[student.first_name,student.middle_name,student.last_name].filter(Boolean).join(' ')||profile?.full_name||'Student';
    const schoolEmail=student.school_email||session.user.email||'—';
    set('studentName',name);set('fullName',name);set('studentId',student.student_id);set('schoolEmail',schoolEmail);set('examNumber',student.exam_number);set('gender',student.gender);set('phone',student.phone);set('className',className);set('sessionName',sessionRow?.name);set('termName',(termRow?.name||'').replaceAll('_',' '));set('enrollmentStatus',enrollment?.status||'Not enrolled');set('studentStatus',student.status);set('summaryId',student.student_id);set('summaryEmail',schoolEmail);set('classChip',`Class ${className}`);set('sessionChip',`Session ${sessionRow?.name||'—'}`);set('termChip',`Term ${(termRow?.name||'—').replaceAll('_',' ')}`);set('statusChip',`● ${student.status||'ACTIVE'}`);set('identityLine',`${student.student_id||'—'} · ${schoolEmail}`);
    const avatar=document.getElementById('avatar');
    if(student.photo_url){avatar.innerHTML=`<img src="${esc(student.photo_url)}" alt="Student passport photograph" loading="eager">`;const img=avatar.querySelector('img');img.addEventListener('error',()=>{avatar.textContent=initials(student)},{once:true});}
    else avatar.textContent=initials(student);
    if(school?.school_name)document.title=`My Profile | ${school.school_name}`;
    document.getElementById('profileLoading').hidden=true;document.getElementById('profileContent').hidden=false;
  }catch(e){
    console.error(e);
    loading.hidden=true;
    const er=document.getElementById('profileError');er.hidden=false;er.innerHTML=`<strong>Profile could not load</strong><p>${esc(e.message)}</p><a class="button" href="student-login.html">Return to Login</a>`;
  }
}

document.getElementById('printProfile')?.addEventListener('click',()=>window.print());
loadProfile();
</script>
</body>
</html>
