<!doctype html>
<html lang="en">
<head>
<script defer src="/assets/clean-urls.js"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0755a5">
<meta name="description" content="Official LAFF Student Portal for Laff British Montessori School. Sign in to access student results, attendance, timetable, fees, announcements and your digital ID card.">
<meta name="robots" content="index,follow">
<link rel="canonical" href="https://student.laffbritishmontessorischool.com/">
<meta property="og:type" content="website">
<meta property="og:title" content="LAFF Student Portal | Laff British Montessori School">
<meta property="og:description" content="Official student portal for Laff British Montessori School (LAFF). Secure access to student services and academic information.">
<meta property="og:url" content="https://student.laffbritishmontessorischool.com/">
<meta property="og:image" content="https://raw.githubusercontent.com/laffbritishschool-gif/Laffbritishmontesorrischool.com/main/assets/school-logo.svg?v=20261029">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="LAFF Student Portal | Laff British Montessori School">
<meta name="twitter:description" content="Official student portal for Laff British Montessori School (LAFF).">
<link rel="icon" type="image/png" sizes="192x192" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<title>LAFF Student Portal | Laff British Montessori School</title>
<link rel="stylesheet" href="/assets/styles.css">
<link rel="stylesheet" href="/assets/dashboard-home.css">
<link rel="stylesheet" href="/assets/portal-polish.css?v=6">
<link rel="stylesheet" href="/assets/profile-menu-fix.css?v=1">
<style>
/* / owns ZERO sidebar markup. assets/app.js is the single sidebar controller. */
#page-loader{position:fixed;inset:0;background:#fff;display:grid;place-items:center;z-index:99999;transition:opacity .45s ease,visibility .45s ease}
#page-loader.hide{opacity:0;visibility:hidden;pointer-events:none}
.loader-box{width:230px;padding:25px 24px;text-align:center;background:#fff;color:#063b78;font-size:12px;font-weight:900}
.loader-spinner{width:38px;height:38px;margin:0 auto 14px;border:4px solid #e7eef7;border-top-color:#0755a5;border-radius:50%;animation:adminSpin .9s linear infinite}
.loader-title{margin:0 0 5px;color:#063b78;font-size:13px}
.loader-sub{margin:0;color:#8290a2;font-size:10px;font-weight:700}
@keyframes adminSpin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.loader-spinner{animation:none}}
</style>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"WebApplication","name":"LAFF Student Portal","url":"https://student.laffbritishmontessorischool.com/","applicationCategory":"EducationApplication","publisher":{"@type":"School","name":"Laff British Montessori School","alternateName":"LAFF","url":"https://laffbritishmontessorischool.com/","logo":"https://raw.githubusercontent.com/laffbritishschool-gif/Laffbritishmontesorrischool.com/main/assets/school-logo.svg?v=20261029"},"description":"Official student portal for Laff British Montessori School (LAFF)."}</script>
</head>
<body>
<div id="page-loader">
  <div class="loader-box">
    <div class="loader-spinner" aria-hidden="true"></div>
    <div class="loader-title">Laff British Montessori School</div>
    <p class="loader-sub">Loading dashboard…</p>
  </div>
</div>

<!-- app.js injects the left sidebar and top shell here. -->
<div id="student-app"></div>

<script type="module">
import { mountStudentShell } from '/assets/app.js';

mountStudentShell({
  title: 'Dashboard',
  subtitle: 'Your academic progress, school updates and student services at a glance.',
  content: `
    <section class="hero home-hero">
      <div class="hero-orbit orbit-one"></div><div class="hero-orbit orbit-two"></div>
      <div class="hero-content">
        <div class="hero-label">Your learning journey</div>
        <h2 id="schoolName" data-school-name>Laff British Montessori School</h2>
        <p id="schoolMotto" data-school-motto>Learning · Character · Excellence</p>
        <div class="hero-meta">
          <span class="pill">Session <strong id="sessionName">—</strong></span>
          <span class="pill">Term <strong id="termName">—</strong></span>
          <span class="pill">Status <strong id="studentStatus">ACTIVE</strong></span>
        </div>
      </div>
      <div class="hero-profile">
        <div class="hero-profile-top"><span>Student profile</span><span class="hero-status">● Active</span></div>
        <div class="hero-profile-main"><div class="hero-avatar" id="heroAvatar">ST</div><div><h3 id="heroStudentName">Student</h3><p id="heroStudentClass">Class not assigned</p></div></div>
        <div class="hero-profile-foot"><div><span>Registration</span><b id="heroStudentId">—</b></div><div><span>Portal access</span><b>Enabled</b></div></div>
      </div>
    </section>



    <div id="dashboardLoading" class="dashboard-loading"><span class="loading-dot"></span> Preparing your latest academic information…</div>
    <div id="dashboardContent" hidden>
    <section class="dashboard-student-profile card" aria-labelledby="dashboardProfileHeading">
      <div class="dashboard-profile-heading">
        <div><span class="eyebrow">Your details</span><h2 id="dashboardProfileHeading">Student profile</h2><p>Your registered information for this school account.</p></div>
        <a class="button secondary dashboard-profile-link" href="/student-profile"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg> View full profile</a>
      </div>
      <div class="dashboard-profile-body">
        <div class="dashboard-profile-identity">
          <div class="dashboard-profile-photo" id="dashboardProfileAvatar">ST</div>
          <div><h3 id="dashboardProfileName">Student</h3><p id="dashboardProfileClass">Class not assigned</p><span class="dashboard-profile-status" id="dashboardProfileStatus">ACTIVE</span></div>
        </div>
        <div class="dashboard-profile-details">
          <div class="dashboard-profile-detail"><small>Registration number</small><b id="dashboardProfileId">—</b></div>
          <div class="dashboard-profile-detail"><small>Exam number</small><b id="dashboardProfileExam">—</b></div>
          <div class="dashboard-profile-detail"><small>School email</small><b id="dashboardProfileEmail">—</b></div>
          <div class="dashboard-profile-detail"><small>Phone number</small><b id="dashboardProfilePhone">—</b></div>
          <div class="dashboard-profile-detail"><small>Gender</small><b id="dashboardProfileGender">—</b></div>
          <div class="dashboard-profile-detail"><small>Academic session</small><b id="dashboardProfileSession">—</b></div>
          <div class="dashboard-profile-detail"><small>Current term</small><b id="dashboardProfileTerm">—</b></div>
          <div class="dashboard-profile-detail"><small>Enrollment</small><b id="dashboardProfileEnrollment">—</b></div>
        </div>
      </div>
    </section>
      <section class="grid dash-grid">
        <div class="stat dash-stat"><div class="stat-top"><span class="label">Published subjects</span><span class="mini">LIVE</span></div><h3 id="subjectsCount">—</h3><p>Results available this term</p><div class="stat-glow"></div></div>
        <div class="stat dash-stat"><div class="stat-top"><span class="label">Attendance</span><span class="mini">TRACKED</span></div><h3 id="attendancePct">—</h3><p>Recorded attendance</p><div class="stat-glow"></div></div>
        <div class="stat dash-stat"><div class="stat-top"><span class="label">Term average</span><span class="mini">CURRENT</span></div><h3 id="averagePct">—</h3><p>Published results</p><div class="stat-glow"></div></div>
        <div class="stat dash-stat fee-stat"><div class="stat-top"><span class="label">Fee balance</span><span class="mini">ACCOUNT</span></div><h3 id="balance">—</h3><p id="balanceLabel">Current balance</p><div class="stat-glow"></div></div>
      </section>

      <section class="pulse-card" aria-label="Learning pulse">
        <div class="pulse-copy"><div class="eyebrow">Learning pulse</div><h2>Keep your momentum going.</h2><p>Use your current attendance and published results to stay focused on the term.</p></div>
        <div class="pulse-metrics">
          <div class="pulse-metric"><div><span>Attendance</span><b id="pulseAttendance">—</b></div><div class="progress"><i id="attendanceProgress"></i></div></div>
          <div class="pulse-metric"><div><span>Academic average</span><b id="pulseAverage">—</b></div><div class="progress"><i id="averageProgress"></i></div></div>
          <div class="pulse-metric"><div><span>Results published</span><b id="pulseSubjects">—</b></div><div class="progress"><i id="subjectsProgress"></i></div></div>
        </div>
        <div class="pulse-mark">✦</div>
      </section>

      <section class="content dash-columns">
        <div class="card dash-card"><div class="section-head dash-head"><h2>Academic snapshot</h2><a href="/student-results">View full results →</a></div><div id="resultList"><div class="empty">Loading results…</div></div></div>
        <div class="card dash-card"><div class="section-head dash-head"><h2>Latest announcements</h2><a href="/student-announcements">See all →</a></div><div id="noticeList"><div class="empty">Loading announcements…</div></div></div>
      </section>

      <section class="content lower-grid">
        <div class="card dash-card"><div class="section-head dash-head"><h2>Attendance summary</h2><a href="/student-attendance">Open attendance →</a></div><div class="attendance-box" id="attendanceBreakdown"><div><b>—</b><span>Present</span></div><div><b>—</b><span>Absent</span></div><div><b>—</b><span>Late</span></div></div></div>
        <div class="card dash-card"><div class="section-head dash-head"><h2>Quick access</h2><span class="muted">Student services</span></div><div class="quick-grid">
          <a href="/student-results"><span class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5m0 14h16M8 15v-3m4 3V7m4 8v-6m4 6V4"/></svg></span><b>Results</b><small>Academic record</small></a>
          <a href="/student-timetable"><span class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18M8 15h.01M12 15h.01M16 15h.01"/></svg></span><b>Timetable</b><small>Class schedule</small></a>
          <a href="/student-fees"><span class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M3 10h18M16 15h.01M7 6V4h12"/></svg></span><b>Fees</b><small>Account status</small></a>
          <a href="/student-profile"><span class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><b>Profile</b><small>Personal details</small></a>
          <a href="/student-announcements"><span class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-5v12L3 13v-2Z"/><path d="M11.6 15.4 13 21H8l-2-8"/></svg></span><b>Notices</b><small>School updates</small></a>
          <a href="/id-card"><span class="quick-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="9" cy="11" r="2"/><path d="M6 16c.8-1.3 1.8-2 3-2s2.2.7 3 2m3-5h3m-3 4h3"/></svg></span><b>ID Card</b><small>Digital card</small></a>
        </div></div>
      </section>
    </div>
    <footer class="footer">© 2026 Laff British Montessori School · Student Portal</footer>
  `
});
</script>
<script type="module" src="/assets/dashboard.js"></script>
</body>
</html>
