<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png" type="image/png">
<title>My Results | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<style>
.result-page{max-width:1250px;margin:0 auto}.result-actions{display:flex;gap:9px;align-items:center}.result-hero{background:linear-gradient(135deg,#063b78,#0b68c9);border-radius:24px;padding:24px;color:#fff;position:relative;overflow:hidden;box-shadow:0 18px 48px rgba(7,85,165,.18);margin-bottom:16px}.result-hero:after{content:"";position:absolute;width:280px;height:280px;border:1px solid #ffffff28;border-radius:50%;right:-90px;top:-120px;box-shadow:0 0 0 32px #ffffff08,0 0 0 64px #ffffff04}.school-head{display:flex;align-items:center;gap:15px;position:relative;z-index:1}.school-head img{width:68px;height:68px;background:#fff;border-radius:50%;padding:6px;object-fit:contain;box-shadow:0 8px 22px #0002}.school-head h2{margin:0;font-size:24px}.school-head p{margin:5px 0 0;color:#dcecff;font-size:13px}.student-strip{margin-top:20px;display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px;position:relative;z-index:1}.student-item{background:#ffffff12;border:1px solid #ffffff22;border-radius:14px;padding:11px 13px}.student-item small{display:block;color:#cfe3fb;text-transform:uppercase;letter-spacing:.07em;font-size:9px;font-weight:900}.student-item b{display:block;margin-top:4px;font-size:13px}.sheet{background:#fff;border:1px solid var(--border);border-radius:22px;padding:25px;box-shadow:var(--shadow)}.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;padding-bottom:18px;border-bottom:2px solid #edf1f6}.school-meta{display:flex;gap:13px;align-items:center}.school-meta img{width:58px;height:58px;object-fit:contain}.school-meta h3{margin:0;color:var(--blue-dark);font-size:19px}.school-meta p{margin:5px 0 0;color:var(--muted);font-size:11px;line-height:1.5;white-space:pre-line}.report-title{text-align:right}.report-title strong{display:block;color:var(--blue-dark);font-size:19px}.report-title span{display:block;color:var(--muted);font-size:12px;margin-top:4px}.student-details{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.detail-box{border:1px solid var(--border);background:#f9fbfe;border-radius:13px;padding:11px 12px}.detail-box small{display:block;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.08em;font-weight:900}.detail-box b{display:block;color:var(--text);font-size:13px;margin-top:4px}.result-table{width:100%;border-collapse:separate;border-spacing:0;overflow:hidden;border:1px solid var(--border);border-radius:14px}.result-table th{background:#063b78;color:#fff;padding:12px 11px;text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.05em}.result-table td{padding:12px 11px;border-bottom:1px solid #edf1f6;font-size:12px}.result-table tr:last-child td{border-bottom:0}.result-table tbody tr:hover{background:#fbfdff}.grade-a{background:#eaf7ef;color:#16834a}.grade-b{background:#eef5ff;color:#0755a5}.grade{display:inline-flex;padding:5px 8px;border-radius:999px;font-weight:900;font-size:11px}.summary-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.summary-box{padding:15px;border-radius:15px;background:linear-gradient(145deg,#f8fbff,#fffdf0);border:1px solid var(--border)}.summary-box small{color:var(--muted);font-size:10px;text-transform:uppercase;font-weight:900}.summary-box strong{display:block;color:var(--blue-dark);font-size:22px;margin-top:5px}.remarks{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:15px}.remark-box{border:1px solid var(--border);border-radius:15px;padding:15px;background:#fff}.remark-box small{display:block;color:var(--muted);font-weight:900;text-transform:uppercase;font-size:10px;margin-bottom:7px}.signature-row{display:grid;grid-template-columns:1fr 1fr;gap:50px;margin-top:38px}.signature{border-top:1px solid #b8c4d2;padding-top:8px;color:var(--muted);font-size:11px}.secure-note{margin-top:18px;padding:11px 13px;border-radius:12px;background:#f6f9fd;color:var(--muted);font-size:10px;text-align:center}.state{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;background:#fafcff}.state strong{display:block;color:var(--blue-dark);font-size:17px;margin-bottom:6px}.print-only{display:none}.result-page>.page-tools{display:flex;justify-content:flex-end;margin:0 0 12px}.result-page>.page-tools .button{white-space:nowrap}
@media(max-width:800px){.student-strip,.student-details,.summary-row{grid-template-columns:1fr 1fr}.sheet-head{flex-direction:column}.report-title{text-align:left}}
@media(max-width:560px){.student-strip,.student-details,.summary-row{grid-template-columns:1fr}.school-head h2{font-size:18px}.sheet{padding:15px}.result-table{min-width:760px}.table-scroll{overflow:auto}.result-actions{width:100%}.result-actions .button{flex:1;justify-content:center}.result-page>.page-tools{justify-content:stretch}.result-page>.page-tools .button{width:100%}}
@media print{body{background:#fff!important}.sidebar,.top,.result-hero,.result-page>.page-tools,.footer,.toast{display:none!important}.main{margin:0!important;width:100%!important;padding:0!important}.result-page{max-width:none}.sheet{box-shadow:none;border:0;border-radius:0;padding:8mm}.print-only{display:block}.sheet-head{margin-top:0}.result-table th{background:#063b78!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}.grade-a,.grade-b{-webkit-print-color-adjust:exact;print-color-adjust:exact}.secure-note{border:1px solid #ddd}@page{size:A4 portrait;margin:0}}
</style>
</head>
<body>
<div id="student-app"></div>
<script type="module">
import { mountStudentShell } from './assets/app.js';
mountStudentShell({
  title:'My Results',
  subtitle:'View your published academic performance and printable result sheet.',
  content:`
  <div class="result-page">
    <div class="page-tools result-actions"><button class="button yellow" id="printResult" type="button">🖨 Print Result</button></div>
    <section class="result-hero">
      <div class="school-head"><img id="heroLogo" src="https://i.ibb.co/whtP8S5v/image.png" alt="School logo"><div><h2 id="heroSchoolName">Laff British Montessori School</h2><p id="heroMotto">Excellence · Character · Confidence · Knowledge</p></div></div>
      <div class="student-strip"><div class="student-item"><small>Student</small><b id="heroStudent">Loading…</b></div><div class="student-item"><small>Student ID</small><b id="heroStudentId">—</b></div><div class="student-item"><small>Class</small><b id="heroClass">—</b></div><div class="student-item"><small>Session / Term</small><b id="heroSessionTerm">—</b></div></div>
    </section>
    <section class="sheet" id="printableResult">
      <div class="sheet-head"><div class="school-meta"><img id="sheetLogo" src="https://i.ibb.co/whtP8S5v/image.png" alt="School logo"><div><h3 id="schoolName">Laff British Montessori School</h3><p id="schoolContact">Loading school information…</p></div></div><div class="report-title"><strong>STUDENT RESULT SHEET</strong><span id="reportSession">Academic Session</span><span id="reportTerm">Term</span></div></div>
      <div class="student-details"><div class="detail-box"><small>Student Name</small><b id="studentName">Loading…</b></div><div class="detail-box"><small>Student ID</small><b id="studentId">—</b></div><div class="detail-box"><small>Class</small><b id="className">—</b></div><div class="detail-box"><small>Status</small><b id="studentStatus">—</b></div><div class="detail-box"><small>Examination No.</small><b id="examNo">—</b></div><div class="detail-box"><small>Session</small><b id="sessionName">—</b></div><div class="detail-box"><small>Term</small><b id="termName">—</b></div><div class="detail-box"><small>Result Status</small><b id="resultStatus">—</b></div></div>
      <div id="resultState" class="state"><strong>Loading your result…</strong><span>Please wait while your published academic record is loaded.</span></div>
      <div class="table-scroll" id="resultTableWrap" hidden><table class="result-table"><thead><tr><th>#</th><th>Subject</th><th>CA / 30</th><th>Exam / 70</th><th>Total / 100</th><th>Grade</th><th>Point</th><th>Teacher's Remark</th></tr></thead><tbody id="resultBody"></tbody></table></div>
      <div class="summary-row" id="summaryRow" hidden><div class="summary-box"><small>Term Average</small><strong id="average">—</strong></div><div class="summary-box"><small>Overall Grade</small><strong id="overallGrade">—</strong></div><div class="summary-box"><small>Class Position</small><strong id="position">—</strong></div><div class="summary-box"><small>Subjects Offered</small><strong id="subjectsCount">—</strong></div></div>
      <div class="remarks" id="remarks" hidden><div class="remark-box"><small>Class Teacher's Remark</small><b id="teacherRemark">—</b></div><div class="remark-box"><small>Principal's Remark</small><b id="principalRemark">—</b></div></div>
      <div class="signature-row"><div class="signature">Class Teacher's Signature · Date</div><div class="signature">Principal's Signature · Date</div></div>
      <div class="secure-note">This result sheet is valid only when marked as published by Laff British Montessori School.</div>
    </section>
    <div class="footer">© 2026 Laff British Montessori School · Student Portal · Academic Records</div>
  </div>`
});
</script>
<script type="module" src="assets/results.js"></script>
</body></html>
