<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<title>Attendance | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/portal-polish.css"><link rel="stylesheet" href="assets/attendance-page.css">
</head>
<body>
<div id="student-app"></div>
<script type="module">
import { mountStudentShell, supabase } from './assets/app.js';
mountStudentShell({title:'My attendance',subtitle:'Track your attendance record from the live school register.',content:`
<div id="attendanceLoading" class="card" style="padding:35px;text-align:center"><div class="spinner"></div><strong>Loading your attendance…</strong><p class="muted">Preparing your current attendance record.</p></div>
<div id="attendanceContent" class="attendance-shell" hidden>
<section class="attendance-hero"><div><div class="eyebrow" style="color:#cfe2ff">Student attendance</div><h2 id="studentName">Student</h2><p id="studentContext">—</p><div class="attendance-context"><span class="attendance-chip" id="sessionChip">Session</span><span class="attendance-chip" id="classChip">Class</span></div></div></section>
<section class="attendance-grid"><div class="attendance-stat good"><small>Attendance rate</small><strong id="attendanceRate">0%</strong><span>Present + half-credit late</span></div><div class="attendance-stat"><small>Present</small><strong id="presentCount">0</strong><span>Days present</span></div><div class="attendance-stat warn"><small>Late</small><strong id="lateCount">0</strong><span>Late arrivals</span></div><div class="attendance-stat"><small>Absent</small><strong id="absentCount">0</strong><span>Days absent</span></div></section>
<section class="attendance-card"><div class="attendance-head"><div><h2>Attendance progress</h2><span class="muted" id="progressText">0 recorded days</span></div><span class="att-status att-present" id="targetStatus">On track</span></div><div class="att-progress"><i id="attendanceProgress"></i></div><div class="att-progress-label"><span class="muted">Current rate</span><b id="progressPercent">0%</b></div><p class="muted" id="attendanceMessage">Your attendance summary will appear here once records are available.</p></section>
<section class="attendance-card"><div class="attendance-head"><div><h2>Recent attendance</h2><span class="muted">Latest register entries</span></div><div class="attendance-filter"><select id="monthFilter" class="select"><option value="ALL">All months</option></select><button class="button" id="refreshAttendance" type="button">Refresh</button></div></div><div class="table-wrap"><table class="attendance-table"><thead><tr><th>Date</th><th>Day</th><th>Status</th><th>Note</th></tr></thead><tbody id="attendanceRows"></tbody></table></div></section>
<section class="attendance-note"><div class="attendance-note-icon">✓</div><div><b>Attendance records</b><p class="muted">Attendance is recorded and maintained by authorized school staff. If you notice an incorrect entry, please contact the school office.</p></div></section>
</div>
<div id="attendanceError" class="card" style="margin-top:15px" hidden></div><div class="footer">Attendance records are controlled by authorized school staff.</div>
`});

const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));
const el=id=>document.getElementById(id); const set=(id,v)=>{if(el(id))el(id).textContent=v??'—'};
const date=v=>new Date(v+'T00:00:00').toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'});
const day=v=>new Date(v+'T00:00:00').toLocaleDateString('en-NG',{weekday:'long'});
function statusInfo(s){return s==='PRESENT'?['Present','att-present']:s==='ABSENT'?['Absent','att-absent']:s==='LATE'?['Late','att-late']:['Excused','att-excused']}
let allRows=[];
function render(){const filter=el('monthFilter').value;const rows=filter==='ALL'?allRows:allRows.filter(r=>r.attendance_date.slice(0,7)===filter);el('attendanceRows').innerHTML=rows.length?rows.map(r=>{const[s,cls]=statusInfo(r.status);return `<tr><td>${date(r.attendance_date)}</td><td>${day(r.attendance_date)}</td><td><span class="att-status ${cls}">${s}</span></td><td>${esc(r.note||'—')}</td></tr>`}).join(''):'<tr><td colspan="4"><div class="attendance-empty"><strong>No attendance records</strong><span>No entries match the selected period.</span></div></td></tr>'}
async function load(){const loading=el('attendanceLoading'),content=el('attendanceContent'),errorBox=el('attendanceError');try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='student-login.html';return}const uid=session.user.id;const[{data:student,error:studentErr},{data:sessionRow}]=await Promise.all([supabase.from('students').select('id,student_id,first_name,last_name,status,photo_url').eq('user_id',uid).maybeSingle(),supabase.from('academic_sessions').select('id,name').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle()]);if(studentErr||!student)throw new Error('Your student profile could not be found. Please contact the school office.');const{data:enrollment,error:enrollErr}=await supabase.from('enrollments').select('id,class_id,status,classes(name)').eq('student_id',student.id).eq('session_id',sessionRow?.id||'').eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();if(enrollErr)throw enrollErr;const{data:attendance,error:attErr}=enrollment?await supabase.from('attendance').select('attendance_date,status,note').eq('enrollment_id',enrollment.id).order('attendance_date',{ascending:false}).limit(500):{data:[]};if(attErr)throw attErr;allRows=attendance||[];const present=allRows.filter(r=>r.status==='PRESENT').length,late=allRows.filter(r=>r.status==='LATE').length,absent=allRows.filter(r=>r.status==='ABSENT').length,excused=allRows.filter(r=>r.status==='EXCUSED').length,total=allRows.length,rate=total?Math.round(((present+late*.5)/total)*100):0;const fullName=[student.first_name,student.last_name].filter(Boolean).join(' ')||'Student';set('studentName',fullName);set('studentContext',`${student.student_id||'—'} · ${student.status||'ACTIVE'}`);set('shellName',fullName);set('shellStudentId',student.student_id||'—');set('shellClass',enrollment?.classes?.name||'—');set('sessionChip',sessionRow?.name||'Current session');set('classChip',enrollment?.classes?.name||'Class not assigned');set('attendanceRate',rate+'%');set('presentCount',present);set('lateCount',late);set('absentCount',absent);set('progressText',`${total} recorded day${total===1?'':'s'}${excused?` · ${excused} excused`:''}`);set('progressPercent',rate+'%');set('attendanceMessage',total?(rate>=90?'Excellent — you are meeting the school’s 90% attendance target.':rate>=75?'Your attendance is below the 90% target. Keep improving your daily attendance.':'Your attendance needs attention. Please speak with the school if there are attendance concerns.'):'No attendance records have been recorded for this enrollment yet.');const target=el('targetStatus');target.textContent=total?(rate>=90?'On track':'Needs attention'):'No records';target.className='att-status '+(rate>=90||!total?'att-present':'att-late');requestAnimationFrame(()=>{el('attendanceProgress').style.width=rate+'%'});const months=[...new Set(allRows.map(r=>r.attendance_date.slice(0,7)))];el('monthFilter').innerHTML='<option value="ALL">All months</option>'+months.map(m=>{const d=new Date(m+'-01T00:00:00');return `<option value="${m}">${d.toLocaleDateString('en-NG',{month:'long',year:'numeric'})}</option>`}).join('');render();loading.hidden=true;content.hidden=false}catch(err){console.error(err);loading.hidden=true;errorBox.hidden=false;errorBox.innerHTML=`<strong>Attendance could not load</strong><p class="muted">${esc(err?.message||'Please try again later.')}</p><a class="button" href="index.html">Return to Dashboard</a>`}}
el('monthFilter').addEventListener('change',render);el('refreshAttendance').addEventListener('click',load);load();
</script>
</body></html>
