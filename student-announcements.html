<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png"><title>Announcements | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/portal-polish.css"><link rel="stylesheet" href="assets/announcements-page.css"></head><body><div id="student-app"></div><script type="module">
import { mountStudentShell, supabase } from './assets/app.js';
mountStudentShell({title:'Announcements',subtitle:'Important notices published by the school.',content:`
<div class="announcements-page"><section class="announcement-hero"><div class="an-hero"><div><div class="an-label">Stay informed</div><h2>What’s happening at school?</h2><p>Latest published notices, reminders and academic updates in one place.</p></div><div class="an-actions"><button class="button light" id="refreshAnnouncements" type="button">Refresh</button></div></div></section><section class="an-summary"><div class="an-stat"><span>Published notices</span><b id="noticeCount">—</b></div><div class="an-stat"><span>Latest update</span><b id="latestDate">—</b></div><div class="an-stat"><span>Portal status</span><b>Live</b></div></section><section class="announcement-card"><div class="an-head"><div><h2>Latest updates</h2><p>Only announcements currently published by the school are shown.</p></div><div class="an-filter"><input id="announcementSearch" type="search" placeholder="Search announcements…" aria-label="Search announcements"></div></div><div id="announcementList" class="announcement-list"><div class="an-empty">Loading announcements…</div></div></section><div class="footer">Only announcements authorized and published by the school appear in this portal.</div></div>`});
const $=id=>document.getElementById(id),esc=v=>{const d=document.createElement('div');d.textContent=String(v??'');return d.innerHTML};let all=[];
async function load(){const list=$('announcementList');try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='student-login.html';return}const{data:student}=await supabase.from('students').select('first_name,middle_name,last_name,student_id,photo_url').eq('user_id',session.user.id).maybeSingle();if(student){const name=[student.first_name,student.middle_name,student.last_name].filter(Boolean).join(' ')||'Student';$('shellName').textContent=name;$('shellStudentId').textContent=student.student_id||'—';const shellClass=$('shellClass');if(shellClass)shellClass.textContent='Student';if(student.photo_url){let photo=String(student.photo_url).trim();try{const marker='/student-passports/';const u=new URL(photo);const i=u.pathname.indexOf(marker);if(i>=0){const path=decodeURIComponent(u.pathname.slice(i+marker.length));const s=await supabase.storage.from('student-passports').createSignedUrl(path,21600);if(!s.error&&s.data?.signedUrl)photo=s.data.signedUrl}}catch{}const a=$('shellAvatar');if(a)a.innerHTML=`<img src="${esc(photo)}" alt="Student passport photograph">`}}const{data,error}=await supabase.from('announcements').select('id,title,body,published_at,created_at').eq('published',true).order('published_at',{ascending:false,nullsFirst:false}).order('created_at',{ascending:false}).limit(50);if(error)throw error;all=data||[];window.__studentNotifications=all;window.dispatchEvent(new CustomEvent('student-notifications-ready',{detail:all}));render()}catch(e){console.error(e);list.innerHTML=`<div class="an-empty"><b>Announcements could not load</b><span>${esc(e.message)}</span></div>`}}
function render(){const term=($('announcementSearch')?.value||'').trim().toLowerCase();const rows=all.filter(a=>!term||`${a.title||''} ${a.body||''}`.toLowerCase().includes(term));$('noticeCount').textContent=all.length.toLocaleString('en-NG');$('latestDate').textContent=all[0]?.published_at?new Date(all[0].published_at).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';$('announcementList').innerHTML=rows.length?rows.map((a,i)=>{const date=a.published_at||a.created_at;return `<article class="announcement-item ${i<2?'unread':''}" style="animation-delay:${i*.04}s"><span class="an-icon">◆</span><div><h3>${esc(a.title||'School announcement')}</h3><div class="an-meta">${date?new Date(date).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'Recently'} · School Administration</div><p>${esc(a.body||'No additional details were provided.')}</p></div><span class="an-tag">PUBLISHED</span></article>`}).join(''):`<div class="an-empty"><b>No announcements found</b><span>Try another search or check again later.</span></div>`} 
$('refreshAnnouncements')?.addEventListener('click',load);$('announcementSearch')?.addEventListener('input',render);load();
</script></body></html>
