<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Payment Receipt | Laff British Montessori School</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef5fd;font-family:Inter,system-ui,sans-serif;color:#17304f}.box{width:min(520px,calc(100% - 30px));background:#fff;border:1px solid #dce7f3;border-radius:24px;padding:34px;text-align:center;box-shadow:0 20px 55px rgba(20,55,95,.1)}.spinner{width:36px;height:36px;border:4px solid #dfeaf7;border-top-color:#0b5ed7;border-radius:50%;margin:0 auto 14px;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}strong{display:block;font-size:18px}p{color:#718096}</style>
</head>
<body><main class="box"><div class="spinner"></div><strong>Opening your receipt…</strong><p>Taking you to the full receipt details and print page.</p></main>
<script>
const params=new URLSearchParams(location.search);const id=params.get('id');const reference=params.get('reference')||params.get('trxref')||params.get('payment_reference');const source=params.get('source');const next=new URL('view-receipt.html',location.href);if(id)next.searchParams.set('id',id);if(reference)next.searchParams.set('reference',reference);if(source)next.searchParams.set('source',source);location.replace(next.href);
</script>
</body></html>
