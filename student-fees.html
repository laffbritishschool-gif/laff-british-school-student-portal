<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png"><title>Fees & Payments | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/portal-polish.css"><link rel="stylesheet" href="assets/fees-page.css"></head><body><div id="student-app"></div><script type="module">
import { mountStudentShell, supabase, escapeHtml } from './assets/app.js';
mountStudentShell({title:'Fees & Payments',subtitle:'View your current school charges, payment progress and complete transaction history.',content:`
<div id="financeLoading" class="card" style="padding:35px;text-align:center"><div class="spinner"></div><strong>Loading your fee account…</strong><p class="muted">Preparing your current charges and complete payment history.</p></div><div id="financeContent" class="finance-shell" hidden><section class="finance-hero"><div class="finance-copy"><div class="eyebrow" style="color:#cfe2ff">Student account</div><h2 id="studentName">Student</h2><p id="studentContext">—</p><div class="attendance-context"><span class="attendance-chip" id="sessionChip">Session</span><span class="attendance-chip" id="termChip">Term</span></div></div><div class="finance-balance"><small id="balanceLabel">Outstanding balance</small><strong id="balanceAmount">₦0.00</strong></div></section><section class="finance-grid"><div class="finance-stat"><small>Total assessed</small><strong id="assessedAmount">₦0.00</strong><span class="sub" id="assessedSub">Current session</span></div><div class="finance-stat"><small>Total paid</small><strong id="paidAmount">₦0.00</strong><span class="status-pill status-paid">Verified</span></div><div class="finance-stat"><small>Outstanding</small><strong id="outstandingAmount">₦0.00</strong><span class="sub" id="dueSub">Account balance</span></div><div class="finance-stat"><small>Transactions</small><strong id="paymentCount">0</strong><span class="sub" id="lastPayment">No transactions recorded</span></div></section><section class="section-card"><div class="finance-section-head"><div><h2>Payment progress</h2><span class="muted" id="progressText">No charges loaded</span></div><span class="status-pill status-pending" id="progressStatus">—</span></div><div class="finance-progress"><i id="feeProgress"></i></div><div class="progress-line"><span class="muted">Paid</span><b id="progressPercent">0%</b></div><div class="finance-note"><div class="finance-note-icon">₦</div><div><b>Keep your payment records safe</b><p class="muted">Only verified transactions are counted as paid. If a payment is missing or incorrect, please contact the school office with your payment reference.</p></div></div></section><section class="section-card"><div class="finance-section-head"><div><h2>Current charges</h2><span class="muted">Charges assigned to your student account</span></div><span class="status-pill status-due" id="chargeTotal">₦0.00</span></div><div id="feeList"><div class="empty-finance"><strong>No charges found</strong><span>No fee records are currently assigned to your account.</span></div></div></section><section class="section-card"><div class="finance-section-head"><div><h2>All transactions</h2><span class="muted">School payments, service payments and recent transaction activity</span></div><span class="status-pill status-pending" id="transactionCountLabel">0 transactions</span></div><div id="paymentList" class="history-list"><div class="empty-finance"><strong>No transaction history</strong><span>No transactions have been recorded for your account yet.</span></div></div></section></div><div id="financeError" class="card" style="margin-top:15px" hidden></div><div class="footer">Fee information is based on the live student account and verified payment records.</div>`});
const money=n=>'₦'+Number(n||0).toLocaleString('en-NG',{minimumFractionDigits:2,maximumFractionDigits:2}),esc=escapeHtml,el=id=>document.getElementById(id),set=(id,v)=>{if(el(id))el(id).textContent=v};
const dateTime=v=>v?new Date(v).toLocaleString('en-NG',{day:'numeric',month:'short',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';
const date=v=>v?new Date(v).toLocaleDateString('en-NG',{day:'numeric',month:'short',year:'numeric'}):'—';
function paymentStatus(s){return s==='PAID'?['Paid','status-paid']:s==='FAILED'?['Failed','status-failed']:s==='CANCELLED'?['Cancelled','status-cancelled']:['Pending','status-pending']}
function normalizeTransaction(row,source,serviceMap={}){
 const metadata=row?.metadata&&typeof row.metadata==='object'?row.metadata:{};
 const paystack=metadata?.paystack&&typeof metadata.paystack==='object'?metadata.paystack:{};
 const nestedMetadata=paystack?.metadata&&typeof paystack.metadata==='object'?paystack.metadata:{};
 const serviceCode=row?.service_code||metadata.service_code||nestedMetadata.service_code||'';
 const serviceTitle=serviceMap[serviceCode]?.title||metadata.service_title||nestedMetadata.service_title||serviceCode||((row?.fee_id)?'School Fee Payment':'Payment');
 return {id:row.id,source,student_id:row.student_id,fee_id:row.fee_id||null,service_code:serviceCode,service_title:serviceTitle,reference:row.reference||'',amount:Number(row.amount||0),currency:row.currency||paystack.currency||'NGN',status:row.status||'PENDING',provider:row.provider||'PAYSTACK',paid_at:row.paid_at||paystack.paid_at||paystack.paidAt||null,created_at:row.created_at||metadata.created_at||paystack.created_at||paystack.createdAt||null,receipt_number:metadata.receipt_number||paystack.receipt_number||null};
}
function mergeTransactions(legacyRows,serviceRows,serviceMap){
 const all=[...(legacyRows||[]).map(r=>normalizeTransaction(r,'School fees',serviceMap)),...(serviceRows||[]).map(r=>normalizeTransaction(r,'Student service',serviceMap))];
 const byReference=new Map();
 all.sort((a,b)=>new Date(b.paid_at||b.created_at||0)-new Date(a.paid_at||a.created_at||0));
 for(const tx of all){const key=tx.reference||`${tx.source}:${tx.id}`;const existing=byReference.get(key);if(!existing||((tx.status==='PAID')&&(existing.status!=='PAID')))byReference.set(key,tx)}
 return [...byReference.values()].sort((a,b)=>new Date(b.paid_at||b.created_at||0)-new Date(a.paid_at||a.created_at||0));
}
function storagePathFromPhoto(value){if(!value)return null;const raw=String(value).trim();if(!/^https?:\/\//i.test(raw))return raw;try{const u=new URL(raw),marker='/student-passports/',i=u.pathname.indexOf(marker);if(i>=0)return decodeURIComponent(u.pathname.slice(i+marker.length))}catch{}return null}
async function getStudentPhotoUrl(value){if(!value)return null;const raw=String(value).trim(),path=storagePathFromPhoto(raw);if(!path)return raw;try{const {data,error}=await supabase.storage.from('student-passports').createSignedUrl(path,21600);if(!error&&data?.signedUrl)return data.signedUrl}catch(e){console.warn('Student passport signing failed',e)}return null}
async function load(){const loading=el('financeLoading'),content=el('financeContent'),errorBox=el('financeError');try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='student-login.html';return}const uid=session.user.id;const[{data:student,error:studentErr},{data:sessionRow},{data:termRow}]=await Promise.all([supabase.from('students').select('id,student_id,first_name,middle_name,last_name,status,photo_url').eq('user_id',uid).maybeSingle(),supabase.from('academic_sessions').select('id,name').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle(),supabase.from('terms').select('id,name,session_id').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle()]);if(studentErr||!student)throw new Error('Your student profile could not be found. Please contact the school office.');const sessionId=sessionRow?.id||'',termId=termRow?.id||'';const[{data:fees,error:feeErr},{data:legacyPayments,error:legacyPayErr},{data:servicePayments,error:servicePayErr},{data:serviceSettings,error:serviceSettingsErr}]=await Promise.all([supabase.from('fees').select('id,title,amount,due_date,term_id,session_id').eq('student_id',student.id).eq('session_id',sessionId).order('due_date',{ascending:true,nullsFirst:false}),supabase.from('payments').select('id,fee_id,reference,amount,status,provider,paid_at,created_at,metadata').eq('student_id',student.id).order('created_at',{ascending:false}),supabase.from('student_service_payments').select('id,student_id,service_code,amount,currency,reference,status,provider,paid_at,created_at,metadata').eq('student_id',student.id).order('created_at',{ascending:false}),supabase.from('student_service_settings').select('service_code,title,amount,is_active')]);if(feeErr)throw feeErr;if(legacyPayErr)console.warn('Legacy payment history could not be loaded:',legacyPayErr);if(servicePayErr)console.warn('Student service payment history could not be loaded:',servicePayErr);if(serviceSettingsErr)console.warn('Service fee settings could not be loaded:',serviceSettingsErr);const feeRows=fees||[],serviceMap=Object.fromEntries((serviceSettings||[]).map(s=>[s.service_code,s])),paymentRows=mergeTransactions(legacyPayErr?[]:(legacyPayments||[]),servicePayErr?[]:(servicePayments||[]),serviceMap),paidRows=paymentRows.filter(p=>p.status==='PAID'),assessed=feeRows.reduce((s,f)=>s+Number(f.amount||0),0),paid=paidRows.reduce((s,p)=>s+Number(p.amount||0),0),balance=Math.max(assessed-paid,0),pct=assessed?Math.min(100,Math.round(paid/assessed*100)):0,paidByFee={};paidRows.forEach(p=>{if(p.fee_id)paidByFee[p.fee_id]=(paidByFee[p.fee_id]||0)+Number(p.amount||0)});const name=[student.first_name,student.middle_name,student.last_name].filter(Boolean).join(' ')||'Student',className='Student';set('studentName',name);set('studentContext',`${student.student_id||'—'} · ${student.status||'ACTIVE'}`);set('shellName',name);set('shellStudentId',student.student_id||'—');set('shellClass',className);set('sessionChip',sessionRow?.name||'Current session');set('termChip',termRow?.name?termRow.name.replaceAll('_',' '):'Current term');set('assessedAmount',money(assessed));set('paidAmount',money(paid));set('outstandingAmount',money(balance));set('balanceAmount',money(balance));set('balanceLabel',balance?'Outstanding balance':'Account fully settled');set('paymentCount',paymentRows.length);set('transactionCountLabel',`${paymentRows.length} transaction${paymentRows.length===1?'':'s'}`);set('assessedSub',`${feeRows.length} charge${feeRows.length===1?'':'s'} assigned`);set('dueSub',balance?'Amount remaining':'No outstanding amount');const latest=paidRows[0];set('lastPayment',latest?`${date(latest.paid_at||latest.created_at)} · ${latest.service_title}`:'No verified payments');set('progressText',assessed?`${money(paid)} of ${money(assessed)} paid`:'No charges loaded');set('progressPercent',`${pct}%`);set('progressStatus',assessed?(balance?'Balance due':'Fully paid'):'No charges');set('chargeTotal',money(assessed));requestAnimationFrame(()=>{el('feeProgress').style.width=pct+'%'});el('feeList').innerHTML=feeRows.map(f=>{const amount=Number(f.amount||0),feePaid=Math.min(amount,paidByFee[f.id]||0),remaining=Math.max(amount-feePaid,0);let label='Outstanding',cls='status-due';if(remaining<=0){label='Paid';cls='status-paid'}else if(feePaid>0){label='Partial';cls='status-pending'}return `<div class="fee-row"><div><div class="fee-title">${esc(f.title)}</div><div class="fee-meta">${f.term_id===termId?'Current term':'Session charge'} · Due ${date(f.due_date)}</div></div><div class="fee-amount">${money(amount)}${feePaid?`<div class="fee-meta">Paid ${money(feePaid)}</div>`:''}</div><span class="status-pill fee-status ${cls}">${label}${remaining>0?` · ${money(remaining)} left`:''}</span></div>`}).join('')||'<div class="empty-finance"><strong>No charges found</strong><span>No fee records are currently assigned to your account.</span></div>';el('paymentList').innerHTML=paymentRows.map(p=>{const[s,cls]=paymentStatus(p.status),receipt=p.receipt_number?`<span class="payment-date">Receipt ${esc(p.receipt_number)}</span>`:'',meta=[p.service_title,p.provider,dateTime(p.paid_at||p.created_at)].filter(Boolean).join(' · '),reference=p.reference||'No reference';return `<div class="payment-row"><div><div class="payment-ref">${esc(reference)}</div><div class="payment-date">${esc(meta)}</div>${receipt}</div><div class="payment-right"><strong>${money(p.amount)}</strong><span class="status-pill ${cls}">${s}</span></div></div>`}).join('')||'<div class="empty-finance"><strong>No transaction history</strong><span>No transactions have been recorded for your account yet.</span></div>';const photo=await getStudentPhotoUrl(student.photo_url),a=el('shellAvatar');if(a){a.innerHTML='';const fallback=(name.split(/\s+/).map(v=>v[0]||'').join('').slice(0,2)||'ST').toUpperCase();if(photo){const img=document.createElement('img');img.src=photo;img.alt='Student passport photograph';img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:inherit';img.onerror=()=>{a.textContent=fallback};a.appendChild(img)}else a.textContent=fallback}loading.hidden=true;content.hidden=false}catch(err){console.error(err);loading.hidden=true;errorBox.hidden=false;errorBox.innerHTML=`<strong>Fees could not load</strong><p class="muted">${esc(err?.message||'Please try again later.')}</p><a class="button" href="index.html">Return to Dashboard</a>`}}load();</script></body></html>
