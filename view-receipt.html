<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<title>View Receipt | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css">
<link rel="stylesheet" href="assets/portal-polish.css">
<style>
:root{--receipt-blue:#063b78;--receipt-blue-2:#0b5ed7;--receipt-border:#dce7f3;--receipt-muted:#718096}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#eef5fd,#f8fbff);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#17304f}
.page{width:min(980px,calc(100% - 28px));margin:34px auto 50px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.toolbar a{color:var(--receipt-blue);font-weight:800;text-decoration:none}.toolbar-actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.receipt-card{background:#fff;border:1px solid var(--receipt-border);border-radius:28px;box-shadow:0 22px 60px rgba(20,55,95,.1);overflow:hidden}.receipt-head{padding:28px 30px;background:linear-gradient(135deg,var(--receipt-blue),var(--receipt-blue-2));color:#fff;display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.school{display:flex;gap:14px;align-items:center}.school img{width:64px;height:64px;object-fit:contain;border-radius:16px;background:#fff;padding:6px}.school small{display:block;color:#cfe2ff;font-weight:800;letter-spacing:.08em}.school h1{margin:5px 0 3px;font-size:24px;color:#fff}.school p{margin:0;color:#dbeeff}.receipt-head-right{text-align:right}.receipt-head-right span{display:inline-flex;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.14);font-weight:900;font-size:12px;letter-spacing:.05em}.receipt-head-right small{display:block;margin-top:10px;color:#dbeeff}
.receipt-body{padding:28px 30px}.title-row{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:22px}.title-row h2{margin:0;color:#102d61}.title-row p{margin:6px 0 0;color:var(--receipt-muted)}.amount-box{text-align:right}.amount-box small{display:block;color:var(--receipt-muted);font-weight:800}.amount-box strong{display:block;color:var(--receipt-blue);font-size:32px;margin-top:5px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.detail{padding:14px 15px;border:1px solid #e4ebf3;border-radius:15px;background:#fbfdff}.detail span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:#8490a3;font-weight:900}.detail strong{display:block;margin-top:5px;color:#173457;overflow-wrap:anywhere}.detail.full{grid-column:1/-1}
.status-note{margin-top:18px;padding:15px;border-radius:15px;background:#edf6ff;color:#0b5ed7;font-weight:700}.status-note.success{background:#eaf8ef;color:#14743b}.status-note.danger{background:#fff0ef;color:#a52a2a}.status-note.neutral{background:#f1f3f6;color:#697586}
.payment-tech{margin-top:20px;padding-top:20px;border-top:1px dashed #d8e3ee}.payment-tech h3{margin:0 0 12px;color:#163b63}.tech-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.tech-item{padding:12px;border-radius:13px;background:#f6f9fc}.tech-item small{display:block;color:#8490a3;font-size:11px}.tech-item strong{display:block;margin-top:4px;overflow-wrap:anywhere}
.actions{display:flex;justify-content:flex-end;gap:10px;padding:0 30px 30px}.button{cursor:pointer;border:0}.button.secondary{background:#fff;color:#123d6d;border:1px solid #cfdae7}.refresh-icon{display:inline-grid;place-items:center;width:18px;height:18px;margin-right:5px}.refreshing .refresh-icon{animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
.loading{width:min(640px,calc(100% - 28px));margin:90px auto;text-align:center;background:#fff;border:1px solid var(--receipt-border);border-radius:24px;padding:42px 25px;box-shadow:0 20px 55px rgba(20,55,95,.08)}.loading .spinner{width:38px;height:38px;border:4px solid #dfeaf7;border-top-color:var(--receipt-blue-2);border-radius:50%;margin:0 auto 15px;animation:spin .7s linear infinite}.loading strong{display:block;color:#173457}.loading p{color:var(--receipt-muted)}
@media(max-width:680px){.receipt-head,.title-row{flex-direction:column}.receipt-head-right,.amount-box{text-align:left}.details,.tech-grid{grid-template-columns:1fr}.detail.full{grid-column:auto}.receipt-body,.receipt-head{padding:22px}.actions{padding:0 22px 22px;flex-direction:column}.actions .button{width:100%;justify-content:center}.toolbar{align-items:flex-start;flex-direction:column}}
@media print{body{background:#fff}.page{width:100%;margin:0}.toolbar,.actions{display:none!important}.receipt-card{border:0;box-shadow:none;border-radius:0}.receipt-head{background:#fff!important;color:#111;border-bottom:2px solid #163b63}.school h1,.receipt-head-right span{color:#111}.school p,.school small,.receipt-head-right small{color:#555}.receipt-body{padding:24px 0}.receipt-head{padding:0 0 20px}.detail{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"><div class="loading"><div class="spinner"></div><strong>Loading receipt…</strong><p>Fetching the transaction details securely.</p></div></div>
<script type="module">
import { supabase, escapeHtml } from './assets/app.js';
const BACKEND='https://paystack-backend-c6hb.onrender.com';
const $=id=>document.getElementById(id),esc=escapeHtml,params=new URLSearchParams(location.search);
const id=params.get('id')||'';const reference=params.get('reference')||'';const source=params.get('source')||'';
const money=(n,currency='NGN')=>new Intl.NumberFormat('en-NG',{style:'currency',currency,minimumFractionDigits:2}).format(Number(n||0));
const dateTime=v=>v?new Date(v).toLocaleString('en-NG',{day:'numeric',month:'long',year:'numeric',hour:'numeric',minute:'2-digit'}):'—';
function statusInfo(status){return status==='PAID'?['PAID','success','Payment confirmed. This is a verified paid transaction.']:status==='REVERSED'?['REVERSED','danger','This payment was received but has been reversed and is not a valid paid receipt.']:status==='CANCELLED'?['CANCELLED','neutral','This pending transaction was cancelled and is no longer an active payment.']:status==='FAILED'?['FAILED','danger','This transaction was not completed successfully.']:['PENDING','neutral','Payment is still pending. Use Get Status to check Paystack for the latest result.']}
async function backend(path,body={}){const{data:{session}}=await supabase.auth.getSession();if(!session)throw new Error('Your session has expired. Please sign in again.');const res=await fetch(`${BACKEND}${path}`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});const payload=await res.json().catch(()=>({}));if(!res.ok)throw new Error(payload.error||'Receipt service request failed.');return payload}
function renderError(message){$('app').innerHTML=`<main class="loading"><div style="width:58px;height:58px;border-radius:50%;margin:0 auto 15px;display:grid;place-items:center;background:#fff0ef;color:#b42318;font-size:28px;font-weight:900">!</div><strong>Receipt could not be loaded</strong><p>${esc(message)}</p><a class="button yellow" style="display:inline-flex;text-decoration:none;padding:12px 18px;border-radius:10px" href="student-fees.html">Back to Fees & Payments</a></main>`}
async function load(){try{if(!id&&!reference)throw new Error('No receipt ID or payment reference was provided.');const{receipt}=await backend('/payments/receipt',{id,reference,source});if(!receipt)throw new Error('Receipt was not found.');const[{data:school}]=await Promise.all([supabase.from('school_settings').select('school_name,motto,logo_url,address,phone,email').limit(1).maybeSingle()]);const[statusText,statusClass,statusMessage]=statusInfo(receipt.status);const official=receipt.official_receipt;const pay=receipt.paystack;const serviceName=receipt.service_title||receipt.service_code||'School Fee Payment';$('app').innerHTML=`<main class="page"><div class="toolbar"><a href="student-fees.html">← Back to Fees & Payments</a><div class="toolbar-actions"><button class="button secondary" id="refreshStatus" type="button"><span class="refresh-icon">↻</span>Get Status</button>${receipt.status==='PAID'?'<button class="button yellow" id="topPrint" type="button">Print Receipt</button>':''}</div></div><section class="receipt-card"><header class="receipt-head"><div class="school"><img src="${esc(school?.logo_url||'https://i.ibb.co/whtP8S5v/image.png')}" alt="School logo"><div><small>OFFICIAL PAYMENT RECORD</small><h1>${esc(school?.school_name||'Laff British Montessori School')}</h1><p>${esc(school?.motto||'Learning · Character · Excellence')}</p></div></div><div class="receipt-head-right"><span>${statusText}</span><small>${receipt.receipt_number?`Receipt ${esc(receipt.receipt_number)}`:'Receipt number not issued'}</small></div></header><div class="receipt-body"><div class="title-row"><div><h2>${esc(serviceName)}</h2><p>${receipt.source==='Student service'?'Student service payment':'School fee payment'} · ${esc(receipt.provider||'PAYMENT')}</p></div><div class="amount-box"><small>Transaction Amount</small><strong>${money(receipt.amount,receipt.currency||'NGN')}</strong></div></div><div class="details"><div class="detail"><span>Student Name</span><strong>${esc(receipt.student_name||'Student')}</strong></div><div class="detail"><span>Student ID</span><strong>${esc(receipt.student_id||'—')}</strong></div><div class="detail"><span>Service / Fee</span><strong>${esc(serviceName)}</strong></div><div class="detail"><span>Status</span><strong>${statusText}</strong></div><div class="detail full"><span>Payment Reference</span><strong>${esc(receipt.reference||'—')}</strong></div><div class="detail"><span>Transaction Created</span><strong>${dateTime(receipt.created_at)}</strong></div><div class="detail"><span>Paid At</span><strong>${dateTime(receipt.paid_at)}</strong></div><div class="detail"><span>Customer Email</span><strong>${esc(receipt.customer_email||'—')}</strong></div><div class="detail"><span>Receipt Number</span><strong>${esc(receipt.receipt_number||'Not issued yet')}</strong></div><div class="detail"><span>Currency</span><strong>${esc(receipt.currency||'NGN')}</strong></div></div><div class="status-note ${statusClass}">${esc(statusMessage)}</div>${pay?`<div class="payment-tech"><h3>Payment details</h3><div class="tech-grid"><div class="tech-item"><small>Paystack Transaction ID</small><strong>${esc(pay.transaction_id||'—')}</strong></div><div class="tech-item"><small>Channel</small><strong>${esc(pay.channel||'—')}</strong></div><div class="tech-item"><small>Gateway Response</small><strong>${esc(pay.gateway_response||'—')}</strong></div><div class="tech-item"><small>Card</small><strong>${esc([pay.card_brand,pay.card_last4?`•••• ${pay.card_last4}`:''].filter(Boolean).join(' ')||'—')}</strong></div><div class="tech-item"><small>Gateway Amount</small><strong>${pay.gateway_amount!=null?money(pay.gateway_amount,receipt.currency||'NGN'):'—'}</strong></div><div class="tech-item"><small>Paystack Fees</small><strong>${pay.fees!=null?money(pay.fees,receipt.currency||'NGN'):'—'}</strong></div></div></div>`:''}</div><div class="actions"><button class="button secondary" id="backButton" type="button">Back to Fees</button>${receipt.status==='PAID'?'<button class="button yellow" id="printButton" type="button">Print Receipt</button>':''}</div></section></main>`;$('backButton')?.addEventListener('click',()=>location.href='student-fees.html');document.querySelectorAll('#printButton,#topPrint').forEach(b=>b.addEventListener('click',()=>window.print()));$('refreshStatus')?.addEventListener('click',async e=>{const b=e.currentTarget;b.disabled=true;b.classList.add('refreshing');try{const result=await backend('/payments/status',{id:receipt.id,reference:receipt.reference,source:receipt.source});location.reload()}catch(error){b.disabled=false;b.classList.remove('refreshing');alert(error.message||'Could not refresh payment status.')}})}catch(error){console.error(error);renderError(error.message||'Could not load receipt.')}}
load();
</script>
</body>
</html>
