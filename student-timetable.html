<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png">
<title>Timetable | Laff British Montessori School</title>
<link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/portal-polish.css"><link rel="stylesheet" href="assets/timetable-page.css">
</head>
<body>
<div id="student-app"></div>
<script type="module">
import { mountStudentShell, supabase, escapeHtml } from './assets/app.js';
mountStudentShell({title:'My Timetable',subtitle:'Your official weekly class schedule.',content:`
<div class="timetable-page">
<section class="timetable-hero"><div class="tb-hero-content"><div class="tb-school"><img id="tbSchoolLogo" src="https://i.ibb.co/whtP8S5v/image.png" alt="School logo"><div><strong id="tbSchoolName">Laff British Montessori School</strong><small id="tbSchoolMotto">Knowledge · Character · Excellence</small></div></div><div class="tb-actions"><button class="button light" id="printTimetable" type="button">Print Timetable</button><button class="button gold" id="refreshTimetable" type="button">Refresh Schedule</button></div></div></section>
<section class="tb-info"><div class="tb-info-card"><span>Student Name</span><b id="tbStudentName">Loading…</b></div><div class="tb-info-card"><span>Student ID</span><b id="tbStudentId">Loading…</b></div><div class="tb-info-card"><span>Class</span><b id="tbClass">Loading…</b></div><div class="tb-info-card"><span>Session / Term</span><b id="tbSession">Loading…</b></div></section>
<section class="tb-schedule"><div class="tb-head"><div><h2>Weekly Class Schedule</h2><p id="tbSubtitle">Loading your published timetable…</p></div></div><div id="timetableGrid" class="tb-grid"><div class="tb-loading"><span class="tb-spinner"></span> Loading your timetable…</div></div><div class="tb-note"><b>Important:</b> Your timetable reflects the schedule published for your class. If an authorized staff member changes the schedule, the updated version will appear here.</div></section>
<div class="footer">Timetable is provided by the school and may change when an authorized staff member publishes an update.</div>
</div>`});

const $=id=>document.getElementById(id);
const fallback={Monday:[],Tuesday:[],Wednesday:[],Thursday:[],Friday:[]};
async function getStudentPhotoUrl(photoValue){
 if(!photoValue)return null;
 const raw=String(photoValue).trim();
 if(/^https?:\/\//i.test(raw)){
  try{const u=new URL(raw);const marker='/student-passports/';const at=u.pathname.indexOf(marker);if(at>=0){const path=decodeURIComponent(u.pathname.slice(at+marker.length));const {data,error}=await supabase.storage.from('student-passports').createSignedUrl(path,60*60*6);if(!error&&data?.signedUrl)return data.signedUrl;}}
  catch{}
  return raw;
 }
 try{const {data,error}=await supabase.storage.from('student-passports').createSignedUrl(raw,60*60*6);if(!error&&data?.signedUrl)return data.signedUrl}catch{}
 return null;
}
function setShellStudent(studentName,studentId,className,photo){
 const fallbackInitials=studentName.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()||'ST';
 $('shellName').textContent=studentName;$('shellStudentId').textContent=studentId||'—';$('shellClass').textContent=className||'—';
 const avatar=$('shellAvatar');
 if(!avatar)return;
 if(photo){avatar.innerHTML=`<img src="${escapeHtml(photo)}" alt="Student passport photograph" loading="eager" decoding="async">`;const img=avatar.querySelector('img');img.addEventListener('error',()=>{avatar.textContent=fallbackInitials},{once:true})}else avatar.textContent=fallbackInitials;
}
async function load(){try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='student-login.html';return}const{data:student,error:studentErr}=await supabase.from('students').select('id,student_id,first_name,middle_name,last_name,photo_url').eq('user_id',session.user.id).maybeSingle();if(studentErr)throw studentErr;if(!student)throw Error('Student profile not found.');const{data:curSession}=await supabase.from('academic_sessions').select('id,name').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle();const{data:term}=await supabase.from('terms').select('id,name').eq('is_current',true).limit(1).maybeSingle();const{data:enrollment,error:enrollErr}=await supabase.from('enrollments').select('class_id,classes(name)').eq('student_id',student.id).eq('session_id',curSession?.id||'').eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();if(enrollErr)throw enrollErr;const name=[student.first_name,student.middle_name,student.last_name].filter(Boolean).join(' ')||'Student',className=enrollment?.classes?.name||'Class not assigned',termName=term?.name?.replaceAll('_',' ')||'Current term',sessionName=curSession?.name||'Current session';$('tbStudentName').textContent=name;$('tbStudentId').textContent=student.student_id||'—';$('tbClass').textContent=className;$('tbSession').textContent=[sessionName,termName].filter(Boolean).join(' · ');$('tbSubtitle').textContent=`${className} · ${termName} · ${sessionName}`;const photo=await getStudentPhotoUrl(student.photo_url);setShellStudent(name,student.student_id,className,photo);if(photo)$('tbSchoolLogo').alt='Student photo loaded';let rows=[];if(enrollment?.class_id&&curSession?.id){const q=await supabase.from('timetables').select('id,day_of_week,start_time,end_time,subject_id,room,subjects(name)').eq('class_id',enrollment.class_id).eq('session_id',curSession.id).order('day_of_week').order('start_time');if(q.error)throw q.error;rows=q.data||[]}const grouped={...fallback};rows.forEach(r=>{const d=String(r.day_of_week||'').trim();if(grouped[d])grouped[d].push(r)});$('timetableGrid').innerHTML=Object.entries(grouped).map(([day,items],i)=>`<div class="tb-day ${new Date().toLocaleDateString('en-US',{weekday:'long'})===day?'tb-today':''}" style="animation-delay:${i*.06}s"><div class="tb-day-title">${escapeHtml(day)}<small>${items.length} period${items.length===1?'':'s'}</small></div>${items.length?items.map(r=>`<div class="tb-period"><time>${escapeHtml(r.start_time||'')} – ${escapeHtml(r.end_time||'')}</time><b>${escapeHtml(r.subjects?.name||'Subject')}</b><span>${escapeHtml(r.room||'Classroom')}</span></div>`).join(''):'<div class="tb-empty">No class published</div>'}</div>`).join('')}catch(e){console.error(e);$('timetableGrid').innerHTML=`<div class="tb-empty"><b>Timetable could not load</b><br>${escapeHtml(e.message)}</div>`}}
$('refreshTimetable')?.addEventListener('click',load);$('printTimetable')?.addEventListener('click',()=>window.print());load();
</script>
</body></html>
