<body>
<div id="student-app"></div>
<script type="module">
import { mountStudentShell, supabase, escapeHtml } from './assets/app.js';
import { servicePaid, verifyPaymentFromUrl, startServicePayment, paymentGateMarkup } from './assets/service-payment.js?v=10';
const SERVICE='ID_CARD';
const GEN_KEY='lbs-id-card-generation-seen';
const SCHOOL_WEBSITE='https://laffbritishmontessorischool.com';
mountStudentShell({title:'My ID Card',subtitle:'Your premium Laff British student identity card, securely generated from your school record.',content:`
<div class="id-page">
<section id="idAccessGate" class="id-access-gate"></section>
<div id="idContent" hidden>
<section class="id-hero"><div><div class="eyebrow" style="color:#e9d98a">Premium student identity</div><h2 id="idStudentName">Preparing…</h2><p id="idStudentContext">Verifying your student identity…</p></div><div class="id-actions"><button class="button" id="printIdCard" type="button">Print ID Card</button><a class="button" href="student-fees.html">Payment History</a></div></section>
<section class="card-section"><div class="template-head"><div><h2>Your Digital Student ID</h2><p>All essential student details are visible on the front. The back carries your identification numbers, serial number, barcode and school website.</p></div><span class="premium-badge"><i></i> Premium Digital Card</span></div><h2 class="print-title">LAFF BRITISH MONTESSORI SCHOOL · STUDENT ID CARD</h2>
<div class="card-stack" id="cardStack">
<div class="id-card front-card"><div class="gold-edge"></div><div class="card-yellow-line"></div><div class="front-inner">
<div class="school-header"><img class="school-logo" id="frontLogo" src="https://i.ibb.co/whtP8S5v/image.png" alt="School logo"><div class="school-header-main"><strong id="frontSchoolName">LAFF BRITISH MONTESSORI SCHOOL</strong><div class="school-address" id="frontSchoolAddress">MOLIPA</div></div><div class="school-motto"><b>LEARNING · CHARACTER · EXCELLENCE</b>Official Student Identification</div></div>
<div class="front-body"><div class="student-photo" id="studentPhoto">ST</div><div><div class="identity-kicker">Student profile</div><div class="student-name" id="cardStudentName">Student</div><div class="detail-grid"><div class="detail"><small>STUDENT ID</small><b id="cardStudentId">—</b></div><div class="detail"><small>CLASS</small><b id="cardClass">—</b></div><div class="detail"><small>EMAIL</small><b id="cardEmail">—</b></div><div class="detail"><small>SESSION</small><b id="cardSession">—</b></div><div class="detail"><small>STATUS</small><b id="cardStatusText">—</b></div><div class="detail"><small>CARD NUMBER</small><b id="cardNumberText">—</b></div></div><span class="status-pill"><span class="status-dot"></span><b id="cardStatus">ACTIVE STUDENT</b></span></div></div>
<div class="front-bottom"><div class="front-bottom-left"><span>Official Student Identity Card</span><span id="frontIssuedExpiry">School-issued identification</span></div><div class="front-card-no"><b>CARD NUMBER</b><span id="cardNumber">—</span></div></div>
</div></div>
<div class="id-card back-card"><div class="back-inner">
<div class="back-school"><img class="school-logo" id="backLogo" src="https://i.ibb.co/whtP8S5v/image.png" alt="School logo"><div><strong id="backSchoolName">LAFF BRITISH MONTESSORI SCHOOL</strong><span id="backSchoolAddress">MOLIPA · OFFICIAL STUDENT IDENTIFICATION</span></div></div>
<div class="back-grid"><div><div class="back-title">Student Identification &amp; Credentials</div><div class="back-sub">Keep these numbers with your school ID. They identify the cardholder and connect the card to the school's student record.</div><div class="identity-list"><div class="identity-box"><small>Student ID</small><b id="backStudentId">—</b></div><div class="identity-box"><small>Serial Number</small><b id="serialNumber">—</b></div><div class="identity-box"><small>ID Card Number</small><b id="backCardNumber">—</b></div><div class="identity-box"><small>Result PIN</small><b id="resultPin">—</b></div></div><div class="back-note"><strong>Protect your Result PIN.</strong> Do not share it publicly or give another student access to your account.</div></div>
<div class="barcode-panel"><div class="barcode-title">Card barcode</div><div class="barcode" id="idBarcode" aria-label="Student card barcode"></div><div class="barcode-label" id="barcodeLabel">—</div></div></div>
<div class="return-note">If found, please return this card to the school office. This card remains school property.</div><div class="website"><span class="website-label">School website</span><a href="${SCHOOL_WEBSITE}" target="_blank" rel="noopener noreferrer">laffbritishmontessorischool.com</a></div>
</div></div>
</div><p class="print-note">Print order: FRONT CARD first · BACK CARD second. Cut each card along its edge after printing.</p></section>
<section class="card access-panel"><div class="section-head"><div><h2>Result Checker Access</h2><span class="muted">Your credentials are tied to your authenticated student account.</span></div><a class="button secondary" href="https://laffbritishschool-gif.github.io/Laff-British-School-/result-checker.html">Open Result Checker</a></div><div class="credential-grid"><div class="credential"><small>Student Email</small><b id="accessEmail">—</b></div><div class="credential"><small>Serial Number</small><b id="accessSerial">—</b></div><div class="credential"><small>Result PIN</small><b id="accessPin">—</b></div><div class="credential"><small>Student ID</small><b id="accessStudentId">—</b></div></div><div class="security">Your ID card is generated from your authenticated student record. Do not share your Result PIN or allow another person to use your account.</div></section>
<div class="footer">Student information is protected by your authenticated school account.</div>
</div></div>`});
const $=id=>document.getElementById(id);
const esc=escapeHtml;
const set=(id,v)=>{if($(id))$(id).textContent=v??'—'};
function storagePathFromPhoto(value){if(!value)return null;const raw=String(value).trim();if(!/^https?:\/\//i.test(raw))return raw;try{const u=new URL(raw),marker='/student-passports/',i=u.pathname.indexOf(marker);if(i>=0)return decodeURIComponent(u.pathname.slice(i+marker.length))}catch{}return null}
async function getPhoto(value){if(!value)return null;const raw=String(value).trim(),path=storagePathFromPhoto(raw);if(!path)return raw;try{const{data,error}=await supabase.storage.from('student-passports').createSignedUrl(path,21600);if(!error&&data?.signedUrl)return data.signedUrl}catch(e){console.warn('Student passport signing failed',e)}return null}
function initials(name){return(name||'Student').split(/\s+/).map(v=>v[0]||'').join('').slice(0,2).toUpperCase()||'ST'}
function formatDate(value){if(!value)return'—';try{return new Intl.DateTimeFormat('en-NG',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(value))}catch{return String(value).slice(0,10)}}
function generationMarkup(step,title,detail,status){return `<div class="card-generation-panel" role="status" aria-live="polite"><div class="gen-stage"><div class="gen-logo-orbit"><span class="gen-ring"></span><span class="gen-ring r2"></span><span class="gen-ring r3"></span><span class="gen-core">LBS</span></div><span class="gen-eyebrow">LAFF BRITISH · PREMIUM ID SERVICE</span><h2>${esc(title)}</h2><p>${esc(detail)}</p><div class="gen-card-preview"><span class="preview-line"></span><span class="preview-photo"></span><span class="preview-bar one"></span><span class="preview-bar two"></span><span class="preview-bar three"></span><span class="preview-gold"></span></div><div class="gen-steps"><div class="gen-step ${step>=1?'active':''}"><b>01</b>Verify identity</div><div class="gen-step ${step>=2?'active':''}"><b>02</b>Build premium card</div><div class="gen-step ${step>=3?'active':''}"><b>03</b>Finalise card</div></div><div class="gen-progress"><i style="width:${step===1?'34%':step===2?'67%':'100%'}"></i></div><span class="gen-status"><i></i>${esc(status)}</span></div></div>`}
async function animateGeneration(gateHost,intro='Your ID-card payment is confirmed. We are preparing your premium Laff British card.'){if(!gateHost)return;gateHost.hidden=false;gateHost.innerHTML=generationMarkup(1,'Generating your digital ID card…',intro,'Securing your student identity');await new Promise(r=>setTimeout(r,1050));gateHost.innerHTML=generationMarkup(2,'Building your premium card…','Applying your passport photo, student identity, school branding and secure result credentials.','Assembling official card details');await new Promise(r=>setTimeout(r,1250));gateHost.innerHTML=generationMarkup(3,'Finalising your digital ID card…','Running the final presentation and identity checks before your card is revealed.','Final checks in progress');await new Promise(r=>setTimeout(r,1150))}
function shouldGenerateFirstVisit(){try{return !sessionStorage.getItem(GEN_KEY)}catch{return true}}
function markGenerated(){try{sessionStorage.setItem(GEN_KEY,'1')}catch{}}
async function requirePayment(){const gate=$('idAccessGate');try{const verified=await verifyPaymentFromUrl(SERVICE);if(verified?.paid){await animateGeneration(gate,'Your payment has just been verified. We are now creating your premium Laff British card.');markGenerated();return true}}catch(e){gate.innerHTML=`<div class="card"><strong>Payment verification needs attention</strong><p class="muted">${esc(e.message||'Please try again.')}</p></div>`;return false}let paid=false;try{paid=await servicePaid(SERVICE)}catch(e){console.warn('ID card paid-status check failed',e)}if(paid){if(shouldGenerateFirstVisit()){await animateGeneration(gate);markGenerated()}return true}const{data:setting,error}=await supabase.from('student_service_settings').select('title,amount,is_active').eq('service_code',SERVICE).maybeSingle();if(error)throw error;if(!setting?.is_active){gate.innerHTML='<div class="card"><strong>ID card access is currently unavailable</strong><p class="muted">Please contact the school office for assistance.</p></div>';return false}gate.innerHTML=paymentGateMarkup({title:'Unlock Your Premium Student ID',description:'Pay the ID card fee to generate your official Laff British digital identity card.',amount:setting.amount,serviceCode:SERVICE});$('servicePayButton')?.addEventListener('click',e=>{const b=e.currentTarget;b.disabled=true;b.textContent='Opening secure checkout…';startServicePayment(SERVICE,{onLoad:()=>{b.textContent='Paystack checkout open'},onSuccess:async()=>{try{await animateGeneration(gate,'Payment confirmed successfully. We are now generating your premium Laff British student card.');markGenerated();await load({skipGate:true,generated:true})}catch(err){console.error(err);b.disabled=false;b.textContent='Pay with Paystack';gate.insertAdjacentHTML('beforeend',`<div style="background:#fdeaea;color:#9b2c2c;margin-top:14px;padding:12px;border-radius:10px">${esc(err.message||'Card generation failed.')}</div>`)}} ,onCancel:()=>{b.disabled=false;b.textContent='Pay with Paystack'},onError:error=>{b.disabled=false;b.textContent='Pay with Paystack';gate.insertAdjacentHTML('beforeend',`<div style="background:#fdeaea;color:#9b2c2c;margin-top:14px;padding:12px;border-radius:10px">${esc(error.message||'Payment verification failed.')}</div>`)}})});return false}
function makeBarcode(value){const text=String(value||'LBS');let bars='';for(let r=0;r<2;r++){for(let i=0;i<text.length;i++){const n=text.charCodeAt(i)+i*17+r*9;bars+=((n%7)+2)+' ';bars+=((n%5)+1)+' ';bars+=((n%3)+1)+' ';} }const widths=bars.trim().split(/\s+/).map(Number);const pieces=[];let black=true;for(const w of widths){pieces.push(`${black?'#082f63':'transparent'} 0 ${w}px`);black=!black}return pieces}
function applyBarcode(value){const el=$('idBarcode');if(!el)return;const units=[];const raw=String(value||'LBS').replace(/\s+/g,'');for(let r=0;r<2;r++){for(let i=0;i<raw.length;i++){const n=raw.charCodeAt(i)+i*17+r*9;units.push((n%4)+1);units.push((n%3)+1);units.push((n%5)+1)}}let total=units.reduce((a,b)=>a+b,0),cursor=0,segments=[];let black=true;for(const unit of units){const pct=(unit/total)*100;segments.push(`${black?'#082f63':'transparent'} ${cursor}% ${cursor+pct}%`);cursor+=pct;black=!black}el.style.background=`linear-gradient(90deg,${segments.join(',')})`}
async function load({skipGate=false,generated=false}={}){try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='student-login.html';return}if(!skipGate&&!(await requirePayment()))return;
const{data:student,error:studentErr}=await supabase.from('students').select('id,student_id,first_name,middle_name,last_name,photo_url,school_email,status').eq('user_id',session.user.id).maybeSingle();
if(studentErr||!student)throw new Error('Your student profile could not be found. Please contact the school office.');
const[{data:sess},{data:school},{data:card}]=await Promise.all([supabase.from('academic_sessions').select('id,name').eq('is_current',true).order('starts_on',{ascending:false}).limit(1).maybeSingle(),supabase.from('school_settings').select('school_name,motto,logo_url,address').limit(1).maybeSingle(),supabase.from('id_cards').select('card_number,issued_at,expires_at,is_active').eq('student_id',student.id).eq('is_active',true).order('issued_at',{ascending:false}).limit(1).maybeSingle()]);
const{data:enrollment}=await supabase.from('enrollments').select('class_id,classes(name)').eq('student_id',student.id).eq('session_id',sess?.id||'').eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();
const name=[student.first_name,student.middle_name,student.last_name].filter(Boolean).join(' ')||'Student';
const className=enrollment?.classes?.name||'Class not assigned';
const email=student.school_email||session.user.email||'—';
const sessionName=sess?.name||'Current session';
const id=student.student_id||'—';
const fallback=initials(name);
const serial=`RC-${String(id).replace(/[^A-Za-z0-9]/g,'').slice(-10)||'LBS000001'}`;
const pin=String(Math.abs([...id].reduce((n,c)=>n*31+c.charCodeAt(0),7))%900000+100000);
const cardNumber=card?.card_number||id;
const schoolName=school?.school_name||'Laff British Montessori School';
const schoolAddress=school?.address||'Molipa';
const status=String(student.status||'ACTIVE').toUpperCase();
set('idStudentName',name);set('idStudentContext',`${id} · ${className} · ${sessionName}`);set('shellName',name);set('shellStudentId',id);set('shellClass',className);
set('frontSchoolName',schoolName.toUpperCase());set('frontSchoolAddress',schoolAddress.toUpperCase());set('backSchoolName',schoolName.toUpperCase());set('backSchoolAddress',`${schoolAddress.toUpperCase()} · OFFICIAL STUDENT IDENTIFICATION`);
set('cardStudentName',name);set('cardStudentId',id);set('cardClass',className);set('cardEmail',email);set('cardSession',sessionName);set('cardStatusText',`${status} STUDENT`);set('cardStatus',`${status} STUDENT`);set('cardNumberText',cardNumber);set('cardNumber',cardNumber);set('backStudentId',id);set('backCardNumber',cardNumber);set('serialNumber',serial);set('resultPin',pin);set('barcodeLabel',`${id} · ${serial}`);set('accessEmail',email);set('accessSerial',serial);set('accessPin',pin);set('accessStudentId',id);set('frontIssuedExpiry',`Issued ${formatDate(card?.issued_at)} · Expires ${formatDate(card?.expires_at)}`);
applyBarcode(`${id}|${serial}|${cardNumber}`);
const logo=school?.logo_url||'https://i.ibb.co/whtP8S5v/image.png';['frontLogo','backLogo'].forEach(x=>{if($(x))$(x).src=logo});
const photo=await getPhoto(student.photo_url),photoEl=$('studentPhoto'),shell=$('shellAvatar');if(photoEl){photoEl.innerHTML='';if(photo){const img=document.createElement('img');img.src=photo;img.alt='Student passport photograph';img.loading='eager';img.decoding='async';img.onerror=()=>{photoEl.textContent=fallback};photoEl.appendChild(img)}else photoEl.textContent=fallback}if(shell){shell.innerHTML='';if(photo){const img=document.createElement('img');img.src=photo;img.alt='Student passport photograph';img.loading='eager';img.decoding='async';img.style.cssText='width:100%;height:100%;object-fit:cover;border-radius:inherit';img.onerror=()=>{shell.textContent=fallback};shell.appendChild(img)}else shell.textContent=fallback}
const content=$('idContent');if(content){content.hidden=false;if(generated){content.classList.add('id-content-reveal');const stack=$('cardStack');if(stack){stack.classList.add('generated-reveal');setTimeout(()=>stack.classList.remove('generated-reveal'),2100)}const gate=$('idAccessGate');if(gate){gate.hidden=true;gate.innerHTML=''}}}
}catch(e){console.error(e);const gate=$('idAccessGate');if(gate)gate.innerHTML=`<div class="card"><strong>Student ID could not load</strong><p class="muted">${esc(e.message||'Please try again later.')}</p></div>`}}
$('printIdCard')?.addEventListener('click',()=>window.print());
load();
</script>
