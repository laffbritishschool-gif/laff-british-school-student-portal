<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="https://i.ibb.co/whtP8S5v/image.png"><title>My ID Card | Laff British Montessori School</title><link rel="stylesheet" href="assets/styles.css"><link rel="stylesheet" href="assets/portal-polish.css"><style>:root{--id-blue:#063b78;--id-blue2:#0b5ed7;--id-yellow:#f4c20d;--id-ink:#102a43;--id-muted:#60758a}.id-hero{display:flex;justify-content:space-between;align-items:center;gap:20px;background:linear-gradient(135deg,var(--id-blue),var(--id-blue2));color:#fff;border-radius:24px;padding:25px;box-shadow:0 18px 40px rgba(11,94,215,.18)}.id-hero h2{color:#fff;margin:5px 0}.id-hero p{margin:0;color:#dbeaff}.id-actions{display:flex;gap:10px;flex-wrap:wrap}.card-section{margin-top:20px}.template-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:15px}.template-head h2{margin:0}.template-head p{margin:4px 0 0;color:var(--id-muted);font-size:13px}.card-stack{display:flex;flex-direction:column;align-items:center;gap:28px;padding:24px;border-radius:22px;background:linear-gradient(180deg,#f8fbff,#eef5fb);border:1px solid #dce8f4}.id-card{width:min(100%,560px);aspect-ratio:85.6/54;position:relative;overflow:hidden;border-radius:18px;box-shadow:0 18px 38px rgba(9,58,111,.16);break-inside:avoid}.front-card{color:#fff;background:linear-gradient(125deg,#052f61 0%,#0b5ed7 65%,#073b73 100%);border:1px solid rgba(255,255,255,.2)}.front-card:before{content:"";position:absolute;width:300px;height:300px;border:45px solid rgba(255,255,255,.055);border-radius:50%;right:-125px;bottom:-170px}.front-card:after{content:"";position:absolute;width:190px;height:190px;border:2px solid rgba(244,194,13,.22);border-radius:50%;left:-110px;top:-105px}.card-yellow-line{height:5px;background:var(--id-yellow);position:absolute;top:0;left:0;right:0}.card-inner{position:relative;z-index:2;height:100%;padding:20px 22px;box-sizing:border-box}.school-row{display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.22);padding-bottom:10px}.school-logo{width:43px;height:43px;border-radius:50%;background:#fff;padding:3px;object-fit:contain}.school-row strong{display:block;font-size:13px;letter-spacing:.35px}.school-row span{display:block;margin-top:3px;font-size:8px;color:#cfe2ff;letter-spacing:.7px;text-transform:uppercase}.front-body{display:grid;grid-template-columns:92px 1fr;gap:17px;margin-top:17px;align-items:start}.student-photo{width:92px;height:108px;border-radius:11px;border:2px solid rgba(255,255,255,.65);background:linear-gradient(145deg,rgba(255,255,255,.25),rgba(255,255,255,.08));display:grid;place-items:center;font-size:30px;font-weight:900;overflow:hidden}.student-photo img{width:100%;height:100%;object-fit:cover}.student-name{font-size:22px;line-height:1.05;font-weight:900;margin-bottom:11px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px 16px}.detail small{display:block;font-size:7px;color:#bcd7f5;letter-spacing:.65px;font-weight:800}.detail b{display:block;font-size:10px;margin-top:2px;color:#fff;word-break:break-word}.status-pill{display:inline-block;margin-top:8px;padding:4px 8px;border-radius:999px;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.25);font-size:8px;font-weight:900;letter-spacing:.5px}.card-footer{position:absolute;left:22px;right:22px;bottom:12px;display:flex;justify-content:space-between;gap:10px;font-size:7px;color:#d6e8fb}.card-number{font-family:monospace;letter-spacing:.5px}.back-card{background:#fff;border:1px solid #d5e2ef;color:var(--id-ink)}.back-card:before{content:"";position:absolute;width:300px;height:300px;border-radius:50%;background:rgba(11,94,215,.035);right:-150px;top:-160px}.back-card:after{content:"";position:absolute;width:170px;height:170px;border:2px solid rgba(244,194,13,.25);border-radius:50%;left:-115px;bottom:-110px}.back-inner{position:relative;z-index:2;height:100%;padding:18px 22px;box-sizing:border-box}.back-header{display:flex;align-items:center;gap:10px;padding-bottom:9px;border-bottom:2px solid var(--id-yellow)}.back-header .school-logo{width:36px;height:36px}.back-header strong{font-size:12px;color:var(--id-blue);display:block}.back-header span{font-size:7px;color:var(--id-muted);display:block;margin-top:2px;text-transform:uppercase;letter-spacing:.6px}.back-content{margin-top:13px}.back-title{font-size:14px;font-weight:900;color:var(--id-blue);margin-bottom:4px}.back-sub{font-size:8px;color:var(--id-muted);margin-bottom:10px}.credentials{display:grid;grid-template-columns:1fr 1fr;gap:9px}.credential-box{background:#f4f8fc;border:1px solid #dbe7f1;border-radius:9px;padding:8px 10px}.credential-box small{display:block;color:#718096;font-size:7px;font-weight:800;text-transform:uppercase;letter-spacing:.5px}.credential-box b{display:block;color:var(--id-blue);font-family:monospace;font-size:12px;margin-top:3px;letter-spacing:.3px}.back-bottom{display:grid;grid-template-columns:1fr 120px;gap:15px;align-items:end;margin-top:12px}.warning{font-size:7.5px;line-height:1.4;color:#53697d}.warning strong{color:#9a7200}.barcode{height:34px;border-radius:3px;background:repeating-linear-gradient(90deg,#063b78 0 2px,transparent 2px 5px);opacity:.85}.barcode-label{text-align:center;font:7px monospace;color:#718096;margin-top:3px}.return-note{position:absolute;bottom:10px;left:22px;right:22px;border-top:1px solid #dbe5ef;padding-top:6px;font-size:6.8px;color:#718096;text-align:center}.access-panel{margin-top:20px}.credential-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.credential{background:#f7fbff;border:1px solid #dfebf7;border-radius:14px;padding:14px}.credential small{display:block;color:#718096;font-weight:700;margin-bottom:5px}.credential b{display:block;color:var(--id-blue);font-family:monospace;font-size:14px;word-break:break-all}.security{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff8df;border:1px solid #f0dc8d;font-size:12px}.print-title,.print-note{display:none}@media(max-width:900px){.id-hero{align-items:flex-start;flex-direction:column}.credential-grid{grid-template-columns:1fr 1fr}.id-card{width:100%}}@media(max-width:560px){.id-actions{width:100%}.id-actions .button{flex:1}.card-stack{padding:10px}.id-card{border-radius:14px}.card-inner,.back-inner{padding:14px}.front-body{grid-template-columns:72px 1fr;gap:10px;margin-top:12px}.student-photo{width:72px;height:88px}.student-name{font-size:17px;margin-bottom:7px}.detail-grid{gap:5px 9px}.detail b{font-size:8px}.detail small{font-size:6px}.card-footer{left:14px;right:14px;bottom:8px}.credentials{gap:6px}.credential-box{padding:6px}.credential-box b{font-size:9px}.back-bottom{grid-template-columns:1fr 80px}.barcode{height:25px}.credential-grid{grid-template-columns:1fr}}@media print{@page{size:A4 portrait;margin:14mm 0}html,body{background:#fff!important;margin:0!important;padding:0!important}.sidebar,.top,.id-hero,.access-panel,.footer,.toast,.template-head{display:none!important}.main{margin:0!important;padding:0!important;width:100%!important}.card-section{margin:0!important;padding:0!important}.print-title{display:block!important;text-align:center;font-size:14px;margin:0 0 5mm;color:#063b78}.print-note{display:block!important;text-align:center;font-size:8px;color:#718096;margin:5mm 15mm 0}.card-stack{display:flex!important;flex-direction:column!important;align-items:center!important;gap:12mm!important;padding:0!important;background:#fff!important;border:0!important;border-radius:0!important}.id-card{width:85.6mm!important;height:54mm!important;min-width:85.6mm!important;min-height:54mm!important;max-width:85.6mm!important;max-height:54mm!important;aspect-ratio:auto!important;border-radius:4mm!important;box-shadow:none!important;break-inside:avoid!important;page-break-inside:avoid!important}.card-inner,.back-inner{padding:4.5mm!important}.school-logo{width:11mm!important;height:11mm!important}.school-row{gap:2.5mm;padding-bottom:2.5mm}.school-row strong{font-size:3.25mm}.school-row span{font-size:1.9mm}.front-body{grid-template-columns:18mm 1fr;gap:3.5mm;margin-top:4mm}.student-photo{width:18mm;height:21.5mm;border-radius:2.5mm}.student-name{font-size:5.5mm;margin-bottom:2.5mm}.detail-grid{gap:1.5mm 4mm}.detail small{font-size:1.7mm}.detail b{font-size:2.4mm;margin-top:.4mm}.status-pill{margin-top:2mm;padding:1mm 2mm;font-size:1.8mm}.card-footer{left:4.5mm;right:4.5mm;bottom:2.5mm;font-size:1.7mm}.back-inner{padding:4mm 4.5mm!important}.back-header{gap:2.5mm;padding-bottom:2.2mm}.back-header .school-logo{width:9mm!important;height:9mm!important}.back-header strong{font-size:3mm}.back-header span{font-size:1.7mm}.back-content{margin-top:3mm}.back-title{font-size:3.8mm;margin-bottom:1mm}.back-sub{font-size:2mm;margin-bottom:2.5mm}.credentials{gap:2.5mm}.credential-box{padding:2mm 2.5mm;border-radius:2mm}.credential-box small{font-size:1.7mm}.credential-box b{font-size:3mm;margin-top:.7mm}.back-bottom{grid-template-columns:1fr 30mm;gap:3mm;margin-top:3mm}.warning{font-size:1.8mm;line-height:1.35}.barcode{height:8mm}.barcode-label{font-size:1.6mm;margin-top:.5mm}.return-note{bottom:2.5mm;left:4.5mm;right:4.5mm;padding-top:1.5mm;font-size:1.65mm}}</style></head><body><div id="student-app"></div><script type="module">
import { mountStudentShell, supabase } from './assets/app.js';
mountStudentShell({title:'My ID Card',subtitle:'Your official school identification card and result-checking credentials.',content:`
<section class="id-hero"><div><div class="eyebrow" style="color:#cfe2ff">Student identification</div><h2 id="idStudentName">Loading…</h2><p id="idStudentContext">Loading student information…</p></div><div class="id-actions"><button class="button" id="printIdCard" type="button">Print ID Card</button><button class="button yellow" data-toast="Digital ID saved for quick access." type="button">Save ID</button></div></section>
<section class="card-section"><div class="template-head"><div><h2>ID Card Template</h2><p>Front and back are arranged vertically for clean A4 printing.</p></div><span class="status paid">ACTIVE</span></div><h2 class="print-title">LAFF BRITISH MONTESSORI SCHOOL · STUDENT ID CARD</h2><div class="card-stack">
<div class="id-card front-card"><div class="card-yellow-line"></div><div class="card-inner"><div class="school-row"><img class="school-logo" id="frontLogo" src="https://i.ibb.co/whtP8S5v/image.png"><div><strong>LAFF BRITISH MONTESSORI SCHOOL</strong><span>Learning · Character · Excellence</span></div></div><div class="front-body"><div class="student-photo" id="studentPhoto">ST</div><div><div class="student-name" id="cardStudentName">Student</div><div class="detail-grid"><div class="detail"><small>STUDENT ID</small><b id="cardStudentId">—</b></div><div class="detail"><small>CLASS</small><b id="cardClass">—</b></div><div class="detail"><small>EMAIL</small><b id="cardEmail">—</b></div><div class="detail"><small>SESSION</small><b id="cardSession">—</b></div></div><span class="status-pill" id="cardStatus">● ACTIVE STUDENT</span></div></div><div class="card-footer"><span>Property of Laff British Montessori School</span><span class="card-number" id="cardNumber">CARD NO. —</span></div></div></div>
<div class="id-card back-card"><div class="back-inner"><div class="back-header"><img class="school-logo" id="backLogo" src="https://i.ibb.co/whtP8S5v/image.png"><div><strong>LAFF BRITISH MONTESSORI SCHOOL</strong><span>Official Student Identification · Result Access</span></div></div><div class="back-content"><div class="back-title">Result Checker Credentials</div><div class="back-sub">Use these credentials on the school's public Result Checker to view published academic results.</div><div class="credentials"><div class="credential-box"><small>Serial Number</small><b id="serialNumber">—</b></div><div class="credential-box"><small>Result PIN</small><b id="resultPin">—</b></div></div><div class="back-bottom"><div class="warning"><strong>Keep your PIN private.</strong><br>Do not share the PIN publicly. The live system will generate unique credentials for each student.</div><div><div class="barcode"></div><div class="barcode-label" id="barcodeLabel">—</div></div></div></div><div class="return-note">If found, please return this card to the school office. This card remains school property.</div></div></div></div><p class="print-note">Print order: FRONT CARD first · BACK CARD second. Cut each card along its edge after printing.</p></section>
<section class="card access-panel"><div class="section-head"><div><h2>Result Checker Access</h2><span class="muted">Credentials shown on the back of this ID card</span></div><a class="button secondary" href="https://laffbritishschool-gif.github.io/Laff-British-School-/result-checker.html">Open Result Checker</a></div><div class="credential-grid"><div class="credential"><small>Student Email</small><b id="accessEmail">—</b></div><div class="credential"><small>Serial Number</small><b id="accessSerial">—</b></div><div class="credential"><small>Result PIN</small><b id="accessPin">—</b></div><div class="credential"><small>Student ID</small><b id="accessStudentId">—</b></div></div><div class="security"><b>Prototype notice:</b> These are demonstration credentials. In production, each student will receive unique credentials generated securely by the school system.</div></section><div class="footer">Student information and result credentials are loaded from the authenticated student account.</div>`});
const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const set=(id,v)=>{if($(id))$(id).textContent=v??'—'};
function initials(s){return `${s?.first_name?.[0]||''}${s?.last_name?.[0]||''}`.toUpperCase()||'ST'}
async function photoUrl(value){if(!value)return null;const raw=String(value).trim();try{const u=new URL(raw),marker='/student-passports/',i=u.pathname.indexOf(marker);if(i>=0){const path=decodeURIComponent(u.pathname.slice(i+marker.length));const s=await supabase.storage.from('student-passports').createSignedUrl(path,21600);if(!s.error&&s.data?.signedUrl)return s.data.signedUrl}}catch{}return raw}
async function load(){try{const{data:{session}}=await supabase.auth.getSession();if(!session){location.href='student-login.html';return}const[{data:student,error:studentErr},{data:sess},{data:school}]=await Promise.all([supabase.from('students').select('id,student_id,first_name,middle_name,last_name,photo_url,school_email,status').eq('user_id',session.user.id).maybeSingle(),supabase.from('academic_sessions').select('id,name').eq('is_current',true).limit(1).maybeSingle(),supabase.from('school_settings').select('school_name,logo_url').limit(1).maybeSingle()]);if(studentErr||!student)throw new Error('Your student profile could not be found.');const{data:enrollment}=await supabase.from('enrollments').select('class_id,classes(name)').eq('student_id',student.id).eq('session_id',sess?.id||'').eq('status','ACTIVE').order('created_at',{ascending:false}).limit(1).maybeSingle();const name=[student.first_name,student.middle_name,student.last_name].filter(Boolean).join(' ')||'Student',className=enrollment?.classes?.name||'Class not assigned',email=student.school_email||session.user.email||'—',sessionName=sess?.name||'Current session',id=student.student_id||'—';set('idStudentName',name);set('idStudentContext',`${id} · ${className} · ${sessionName}`);set('shellName',name);set('shellStudentId',id);set('shellClass',className);set('cardStudentName',name);set('cardStudentId',id);set('cardClass',className);set('cardEmail',email);set('cardSession',sessionName);set('cardStatus',`● ${student.status||'ACTIVE'} STUDENT`);set('cardNumber',`CARD NO. ${id}`);set('accessEmail',email);set('accessStudentId',id);const serial=`RC-${String(id).replace(/[^A-Za-z0-9]/g,'').slice(-10)||'LBS000001'}`;const pin=String(Math.abs([...id].reduce((n,c)=>n*31+c.charCodeAt(0),7))%900000+100000);set('serialNumber',serial);set('resultPin',pin);set('barcodeLabel',serial);set('accessSerial',serial);set('accessPin',pin);const logo=school?.logo_url||'https://i.ibb.co/whtP8S5v/image.png';['frontLogo','backLogo'].forEach(x=>{if($(x))$(x).src=logo});const photo=await photoUrl(student.photo_url);const el=$('studentPhoto');if(el){if(photo){el.innerHTML=`<img src="${esc(photo)}" alt="Student passport photograph">`}else el.textContent=initials(student)}const shell=$('shellAvatar');if(shell){if(photo)shell.innerHTML=`<img src="${esc(photo)}" alt="Student passport photograph">`;else shell.textContent=initials(student)}}catch(e){console.error(e);set('idStudentName','Unable to load student');set('idStudentContext',e.message||'Please try again later.')}}$('printIdCard')?.addEventListener('click',()=>window.print());load();
</script></body></html>
